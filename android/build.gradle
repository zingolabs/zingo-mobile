// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "28.2.13676358"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
      classpath('com.android.tools.build:gradle')
      classpath("com.facebook.react:react-native-gradle-plugin")
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin"
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
   repositories {
     maven {
       url("$rootDir/../node_modules/detox/Detox-android")
     }
     google()
     mavenCentral()
     maven { url 'https://www.jitpack.io' }
     // rustls-platform-verifier Android component (TLS for Nym proxy).
     // Located dynamically from the local Cargo cache (~/.cargo/registry/src).
     // On CI machines where cargo is not installed, this block is skipped and
     // the dependency must be available via another repo or pre-cached.
     def cargoHome = System.getenv("CARGO_HOME") ?: "${System.properties['user.home']}/.cargo"
     def verifierMaven = new File(cargoHome, "registry/src").listFiles()?.collectMany { indexDir ->
       indexDir.listFiles()?.findAll { it.name.startsWith("rustls-platform-verifier-android-") }
         ?.collect { new File(it, "maven") } ?: []
     }?.find { it.exists() }
     if (verifierMaven != null) {
       maven { url = uri(verifierMaven) }
     }
   }
 }
 