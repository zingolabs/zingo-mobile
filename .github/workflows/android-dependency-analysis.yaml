name: Android dependency analysis

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false
      # Runner label for the analysis job. PR CI passes CI_GRADLE_RUNNER.
      runner:
        required: false
        type: string
        default: ubuntu-24.04

jobs:
  android-dependency-analysis:
    name: Andr dependency analysis
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: ./.github/actions/gradle-cache

      # The analysis compiles every variant's Kotlin against the Binding
      # Layer AAR that Gradle fetches by the Bundle Pin.
      # Fails on dependencies nothing compiles against; scope and
      # transitive advice is warn-only.
      - name: Dependency analysis
        working-directory: ./android
        run: ./gradlew buildHealth

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
