name: Android dependency analysis

on:
  workflow_call:
    inputs:
      # The key from create-cache-key.yaml, which names the pin and the
      # toolchain that the Kotlin bindings come from.
      cache-key:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-dependency-analysis:
    name: Andr dependency analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # v6 like every other Gradle job here. On v4 this one job wrote the
      # older v1 cache protocol, so the repo carried two full sets of the
      # same Gradle state — transforms and dependencies alone were 3.5 GB
      # of duplicate — against a cache budget that is already evicting
      # entries other jobs need.
      #
      # This job is the one writer of the Gradle caches, and it writes from
      # dev alone. It compiles every variant, the unit tests included, so
      # its entry holds the widest set of dependencies. Every other Gradle
      # job is read-only and falls back to this job's entry. A second
      # writer would leave that fallback to chance: on 2026-10-01 this job
      # fell back to the APK build's entry, which holds no unit test jar,
      # and one failed download from Maven Central then failed the run.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      # The analysis compiles every variant's Kotlin, which needs the Binding
      # Layer's Kotlin bindings. Every variant takes the same bindings.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Generate the Kotlin bindings
        uses: ./.github/actions/kotlin-bindings
        with:
          cache-key: ${{ inputs.cache-key }}

      # Fails on dependencies nothing compiles against (the Kotlin analog
      # of the rust-shear job); scope and transitive advice is warn-only.
      - name: Dependency analysis
        working-directory: ./android
        run: ./gradlew buildHealth

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
