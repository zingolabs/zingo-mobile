name: Visual review

# Builds the PR head, captures it with the web Storybook harness, and diffs
# it against the committed baseline (visual/__baseline__). The check fails
# when a story changed, appeared, or disappeared without a baseline update.
# Accepting is a commit: `yarn visual:accept` pulls this run's capture into
# the baseline, so the accepted pixels are the runner's own.

on:
  pull_request:
    paths:
      - 'components/**'
      - 'app/theme/**'
      - 'app/AppState/**'
      - '.storybook-web/**'
      - 'visual/**'
      - 'assets/**'

permissions:
  contents: read
  pull-requests: write

# Cancel a superseded run when the PR gets a new push.
concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Visual review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Capture PR head
        run: VISUAL_OUT=visual/ci/head yarn visual:snapshot

      # The bundle `yarn visual:accept` downloads to become the baseline.
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-head
          path: visual/ci/head

      # Ship the head build alongside the report so the Current tab embeds it.
      - name: Assemble Current view
        run: cp -r storybook-static visual/ci/storybook

      - name: Diff head vs baseline
        id: diff
        continue-on-error: true
        run: >-
          VISUAL_CURRENT=visual/ci/head
          VISUAL_BASELINE=visual/__baseline__
          VISUAL_REPORT=visual/ci/index.html
          VISUAL_STORYBOOK=storybook/index.html
          yarn tsx visual/diff.mts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual/ci

      # Fork PRs can't read secrets, so this fails there (artifact still up).
      - name: Deploy report to Cloudflare Pages
        id: deploy
        if: always()
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy visual/ci
            --project-name=zingo-visual
            --branch=pr-${{ github.event.number }}

      # Fork PRs get a read-only token, so commenting will fail there — don't
      # let that red the run. The artifact is still uploaded.
      - name: Comment result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const changed = '${{ steps.diff.outcome }}' !== 'success';
            const deployed = '${{ steps.deploy.outcome }}' === 'success';
            // Stable per-PR alias; always points at this PR's latest deploy.
            const url = `https://pr-${context.issue.number}.zingo-visual.pages.dev`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const link = deployed
              ? `**[Open the review page](${url})** — Current, Animations, and Image diffs tabs.`
              : `Download the **visual-review** artifact from [this run](${runUrl}) and open \`index.html\`.`;
            const accept = changed
              ? [
                  '',
                  'If the change is intended, accept it into the baseline from this branch:',
                  '',
                  '```',
                  'yarn visual:accept   # pulls this run\'s capture into visual/__baseline__',
                  'git add visual/__baseline__ && git commit -m "test(visual): accept <what changed>"',
                  '```',
                ]
              : [];
            const marker = '<!-- visual-review -->';
            const body = [
              marker,
              `### Visual review — ${changed ? '⚠️ changes detected' : '✅ matches baseline'}`,
              '',
              `Head vs \`visual/__baseline__\`. ${link}`,
              ...accept,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Gate
        if: steps.diff.outcome != 'success'
        run: |
          echo "Visual changes detected — review the report, then 'yarn visual:accept' and commit visual/__baseline__."
          exit 1
