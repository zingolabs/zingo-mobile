name: Android JVM unit tests

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-unit-test:
    name: Andr JVM unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: ./.github/actions/gradle-cache

      # The test source set reads the proxy crate's Kotlin wire-contract
      # test from the submodule, which the Bundle Pin holds at one commit.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      # The plain-JVM test source set: the FfiOutcome/FfiArgs bridge
      # contracts and their kin. These are the only executable tests of
      # the Kotlin bridge, so they gate the PR.
      - name: Run JVM unit tests
        working-directory: ./android
        run: ./gradlew :app:testProdReleaseUnitTest

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
