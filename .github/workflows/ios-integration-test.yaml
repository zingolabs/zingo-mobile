name: IOS Integration test

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  build-for-testing:
    runs-on: macos-15
    steps:
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: First launch
        run: |
          xcodebuild -runFirstLaunch || true

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Generate SwapKit secrets module
        env:
          SWAPKIT_API_KEY: ${{ secrets.SWAPKIT_API_KEY }}
        run: ./scripts/ci/generate-swapkit-secrets.sh

      - name: Restore iOS xcframework cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
          key: native-ios-xcframework-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn
        run: yarn

      - name: Pod Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: cd ios && pod install

      - name: Info
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices

      - name: Build for testing
        working-directory: ios
        run: |
          set -euxo pipefail
          mkdir -p build/reports build/DerivedData
          xcodebuild build-for-testing \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5,arch=arm64' \
            -derivedDataPath "build/DerivedData" \
            -resultBundlePath "build/reports/Zingo-BuildForTesting.xcresult" \
            -quiet

      - name: Upload Build Result
        uses: actions/upload-artifact@v7
        with:
          name: xctestrun-and-products
          path: ios/build/DerivedData/Build/Products

      - name: Upload IOS build reports (.xcresult)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-integration-build-reports.xcresult
          path: ios/build/reports/Zingo-BuildForTesting.xcresult

      - name: Upload IOS build DerivedData logs (optional)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-integration-build-derived-logs
          path: |
            ios/build/DerivedData/Logs/Test
            ios/build/DerivedData/Logs/CrashReporter
          if-no-files-found: ignore

      - name: Cleaning up build
        run: |
          rm -rf build/reports build/DerivedData || true

