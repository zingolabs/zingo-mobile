name: IOS Integration test

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  build-for-testing:
    runs-on: macos-15
    steps:
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Build for testing
        run: |
          set -euxo pipefail
          rm -rf build/reports build/DerivedData || true
          mkdir -p build/reports build/DerivedData
          xcodebuild build-for-testing \
            -workspace ios/ZingoMobile.xcworkspace \
            -scheme ZingoMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "build/DerivedData" \
            -resultBundlePath "build/reports/ZingoMobile-BuildForTesting.xcresult" \
            -quiet

          mkdir -p out
          cp -R build/DerivedData/Build/Products out/Products
          cp $(find build/DerivedData/Build/Products -name "*.xctestrun" | head -n 1) out/ZingoMobile.xctestrun

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: xctestrun-and-products
          path: ios/out

  ios-integration-test:
    name: IOS Integration test
    needs: build-for-testing
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        test: [
          "offline_testsuite",
          "execute_sync_from_seed",
          "execute_send_from_orchard",
          "execute_currentprice_and_value_transfers_from_seed",
          "execute_sapling_balance_from_seed",
          "execute_parse_addresses"
        ]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Native rust cache
        uses: actions/cache/restore@v4
        with:
          path: rust/lib/Generated
          key: native-ios-uniffi-universal-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Copy libs to ios folder
        working-directory: rust/lib/Generated
        run: cp ./*.* ../../../ios

      - name: Install protoc
        run: brew install protobuf

      - name: Install docker
        run: |
          set -euxo pipefail

          brew install qemu
          brew install docker

          brew developer on

          brew uninstall --ignore-dependencies lima || true
          brew tap-new local/old-lima || true
          brew extract --version=0.22.0 lima local/old-lima || true
          brew install --build-from-source local/old-lima/lima@0.22.0
          brew pin lima@0.22.0

          # Replace limactl with the no-HVF build (if you really need this patch)
          LIMACTL_PATH="$(brew --prefix lima@0.22.0)/bin/limactl"
          sudo curl -L -o "${LIMACTL_PATH}" https://github.com/mikekazakov/lima-nohvf/raw/master/limactl
          sudo chmod +x "${LIMACTL_PATH}"

          brew uninstall --ignore-dependencies colima || true

          sudo curl -L -o /usr/local/bin/colima https://github.com/abiosoft/colima/releases/download/v0.7.3/colima-Darwin-arm64
          sudo chmod +x /usr/local/bin/colima

          /usr/local/bin/colima version || true
          limactl version || true

          brew developer off

          colima start --network-address --arch arm64 --vm-type=qemu

      - name: Grant permissions
        run: |
          sudo chmod 777 ~/.colima/default/docker.sock
          sudo chmod 777 ./scripts/ci/ios_integration_tests_ci.sh

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: rust -> rust/target

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Pull docker image
        run: docker pull zingodevops/regchest:011
      
      - name: Install nvm with node 20.9.0
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
          nvm install 20.9.0
          nvm use 20.9.0

      - name: Yarn
        run: yarn

      - name: Download Build Result
        uses: actions/download-artifact@v4
        with:
          name: xctestrun-and-products
          path: ios/build_in

      - name: Pod Install
        working-directory: ios
        run: pod install

      - name: Run IOS integration tests
        working-directory: ./rust
        run: cargo nextest run ios_integration::universal::${{ matrix.test }} --features "ci regchest" --verbose --release

      - name: Upload IOS test reports (.xcresult)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-integration-reports-${{ matrix.test }}.xcresult
          path: ios/build/reports/ZingoMobile-Test.xcresult

      - name: Upload IOS DerivedData logs (optional)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-integration-derived-logs-${{ matrix.test }}
          path: |
            ios/build/DerivedData/Logs/Test
            ios/build/DerivedData/Logs/CrashReporter
          if-no-files-found: ignore