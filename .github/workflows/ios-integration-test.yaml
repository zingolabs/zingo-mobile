name: IOS Integration test

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  build-for-testing:
    runs-on: macos-15
    steps:
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: First launch
        run: |
          xcodebuild -runFirstLaunch || true

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Native rust cache
        uses: actions/cache/restore@v4
        with:
          path: rust/lib/Generated
          key: native-ios-uniffi-universal-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Copy libs to ios folder
        working-directory: rust/lib/Generated
        run: cp ./*.* ../../../ios

      - name: Install nvm with node 22.18.0
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
          nvm install 22.18.0
          nvm use 22.18.0

      - name: Yarn
        run: yarn

      - name: Pod Install
        working-directory: ios
        run: pod install

      - name: Info
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices

      - name: Build for testing
        working-directory: ios
        run: |
          set -euxo pipefail
          mkdir -p build/reports build/DerivedData
          xcodebuild build-for-testing \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5,arch=arm64' \
            -derivedDataPath "build/DerivedData" \
            -resultBundlePath "build/reports/Zingo-BuildForTesting.xcresult" \
            -quiet

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: xctestrun-and-products
          path: ios/build/DerivedData/Build/Products

      - name: Upload IOS build reports (.xcresult)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-integration-build-reports.xcresult
          path: ios/build/reports/Zingo-BuildForTesting.xcresult

      - name: Upload IOS build DerivedData logs (optional)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-integration-build-derived-logs
          path: |
            ios/build/DerivedData/Logs/Test
            ios/build/DerivedData/Logs/CrashReporter
          if-no-files-found: ignore

      - name: Cleaning up build
        run: |
          rm -rf build/reports build/DerivedData || true

