name: IOS Integration test

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      advisory:
        # Advisory mode: job failures are recorded but do not fail the
        # caller, for runs where iOS is informational (per-PR CI) rather
        # than a gate (nightly).
        required: false
        default: false
        type: boolean

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  build-for-testing:
    continue-on-error: ${{ inputs.advisory }}
    # The CI_IOS_RUNNER repository variable sets the runner label. The
    # fallback warp-macos-15-arm64-12x is WarpBuild's 12-vCPU M4 Pro
    # machine; the stock macos-15 label has three cores. The xcodebuild
    # destination pins no arch (see the build-for-testing step).
    runs-on: ${{ vars.CI_IOS_RUNNER || 'warp-macos-15-arm64-12x' }}
    steps:
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: First launch
        run: |
          xcodebuild -runFirstLaunch || true

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      # The Xcode project takes the Binding Layer from the zingolib submodule.
      - name: Restore the iOS Binding Layer
        uses: actions/cache/restore@v6
        with:
          path: zingolib/bindings/swift/build
          key: binding-layer-ios-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn
        run: yarn

      - name: Pod Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: cd ios && pod install

      - name: Info
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices

      - name: Build for testing
        working-directory: ios
        run: |
          set -euxo pipefail
          mkdir -p build/reports build/DerivedData
          # The destination pins no arch: it resolves arm64 on Apple-silicon
          # runners and x86_64 on the Intel larger-runner pool; the
          # XCFrameworks' simulator slices are fat arm64+x86_64 binaries
          # either way.
          xcodebuild build-for-testing \
            -workspace Zingo.xcworkspace \
            -scheme Zingo \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath "build/DerivedData" \
            -resultBundlePath "build/reports/Zingo-BuildForTesting.xcresult" \
            -quiet

      - name: Run offline XCTest classes
        working-directory: ios
        run: |
          set -euxo pipefail
          xctestrun="$(find build/DerivedData/Build/Products -name '*.xctestrun' | head -n 1)"
          only=()
          for class in \
            ExecuteVersionFromSeed \
            ExecuteAddressesFromSeed \
            ExecuteAddressFromUfvk \
            ExecuteParseAddressForTex \
            ExecuteParseAddressInvalid \
            PriceRefusedWithoutMixnet \
            FfiOutcomeTests \
            FfiArgsTests \
            WalletFileProtectionTests \
            WalletFileDiagnosisTests \
            WalletSwapRecoveryTests
          do
            only+=("-only-testing:ZingoTests/$class")
          done
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -resultBundlePath "build/reports/Zingo-Test.xcresult" \
            "${only[@]}"

      - name: Upload IOS test reports (.xcresult)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-integration-test-reports.xcresult
          path: ios/build/reports/Zingo-Test.xcresult
          if-no-files-found: ignore

      - name: Upload Build Result
        uses: actions/upload-artifact@v7
        with:
          name: xctestrun-and-products
          path: ios/build/DerivedData/Build/Products
          retention-days: 3

      - name: Upload IOS build reports (.xcresult)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-integration-build-reports.xcresult
          path: ios/build/reports/Zingo-BuildForTesting.xcresult

      - name: Upload IOS build DerivedData logs (optional)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-integration-build-derived-logs
          path: |
            ios/build/DerivedData/Logs/Test
            ios/build/DerivedData/Logs/CrashReporter
          if-no-files-found: ignore

      - name: Cleaning up build
        run: |
          rm -rf build/reports build/DerivedData || true
