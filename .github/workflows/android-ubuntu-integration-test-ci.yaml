name: Android Ubuntu Integration tests

on:
  workflow_call:
    inputs:
      timestamp:
        required: true
        type: string
      cache-key:
        required: true
        type: string
      abi:
        required: true
        type: string
      api-level:
        required: true
        type: string
      target:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, the first failure here
      # cancels the whole run, and the bucket matrix fails fast. PR CI
      # opts in; ci-nightly keeps the complete-signal default.
      fail-all:
        required: false
        type: boolean
        default: false

env:
  REPO-OWNER: ${{ github.repository_owner }}
  ABI: ${{ inputs.abi }}
  API-LEVEL: ${{ inputs.api-level }}
  TARGET: ${{ inputs.target }}
  TIMESTAMP: ${{ inputs.timestamp }}

jobs:
  android-ubuntu-integration-test-ci-avd-cache:
    name: Avd Cache Integration
    runs-on: ubuntu-24.04
    env:
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: |
          echo "AVD-ARCH=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: |
          echo "AVD-ARCH=x86" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (write-only)
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          # Only the default branch seeds Gradle caches; PR refs write ~1 GiB
          # per job into the 10 GiB repo quota, and the resulting LRU
          # eviction has raced (and lost) same-run cache handoffs.
          cache-write-only: ${{ github.ref == 'refs/heads/dev' }}
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Check AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          lookup-only: true

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        id: avd-cache-saving
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  # The app and androidTest APKs are assembled once per ABI by the
  # android-apk-build workflow at the caller level; this workflow only
  # consumes its android-build-outputs artifact. PR CI calls this
  # workflow WITHOUT a needs-edge on the APK build: the buckets start at
  # workflow launch, run every APK-independent step (setup, harness
  # prebuild, regtest binaries), and then hold at the ci-gate artifact
  # gate until the APK artifact lands — overlapping ~10 minutes of setup
  # with the build path. ci-nightly keeps its needs-edge, so there the
  # gate opens instantly.
  android-ubuntu-integration-test-ci:
    name: Android Ubuntu Integration test
    needs:
      - android-ubuntu-integration-test-ci-avd-cache
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: ${{ inputs.fail-all }}
      # Buckets of three tests share one job, so the runner setup and
      # emulator boot amortize across the bucket instead of being paid
      # once per test.
      matrix:
        bucket:
          - name: accounts
            tests: execute_version_from_seed execute_addresses_from_ufvk execute_addresses_from_seed
          - name: chain
            tests: execute_sync_from_seed execute_send_from_orchard execute_currentprice_and_value_transfers_from_seed
          - name: ledger-and-parsing
            tests: execute_sapling_balance_from_seed execute_parse_address_for_tex execute_parse_address_invalid
    env:
      RUSTFLAGS: -D warnings
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: |
          echo "AVD-ARCH=x86_64" >> $GITHUB_ENV
          echo "NEXTEST-ABI=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: |
          echo "AVD-ARCH=x86" >> $GITHUB_ENV
          echo "NEXTEST-ABI=x86_32" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "NEXTEST-ABI=arm64" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "NEXTEST-ABI=arm32" >> $GITHUB_ENV

      - name: Grant permissions
        run: |
          sudo chmod 777 ./scripts/ci/android_integration_tests_ci.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install protoc
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: rust -> rust/target

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read-only)
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-write-only: false
          cache-read-only: true

      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          fail-on-cache-miss: true

      - name: Remove unnecessary directories to free up space
        run: |
          set -eux
          echo "Disk space before cleanup:"
          df -h

          sudo apt-get update

          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          podman image prune --all --force || true
          podman system prune --all --force || true

          echo "Disk space after cleanup:"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn

      # Resolve the zingolib commit the same way android-build does: the
      # GITHUB_SHA under zingolib CI, otherwise the pinned rev in
      # rust/Cargo.toml. The ci-build image tag is content-addressed from
      # that commit's .env.testing-artifacts + rust-toolchain.toml +
      # docker-ci/, so deriving it here keeps the zainod/zebrad binaries in
      # lockstep with the zingolib we build against (a fixed tag like 011
      # drifts out of sync).
      - name: Resolve zingolib rev
        run: |
          set -euo pipefail
          if [[ "${{ github.repository }}" == *zingolib* ]]; then
            REV="${GITHUB_SHA}"
          else
            line="$(grep -E '^zingolib[[:space:]]*=' rust/Cargo.toml)"
            # Prefer an explicit rev pin if present.
            REV="$(echo "$line" \
                   | grep -oE 'rev[[:space:]]*=[[:space:]]*"[0-9a-f]+"' \
                   | grep -oE '[0-9a-f]{7,40}' | head -1 || true)"
            # Otherwise the dep is pinned by branch/tag: resolve it to a SHA.
            if [[ -z "$REV" ]]; then
              url="$(echo "$line" | grep -oE 'git[[:space:]]*=[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)".*/\1/')"
              ref="$(echo "$line" | grep -oE '(branch|tag)[[:space:]]*=[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)".*/\1/')"
              echo "Resolving zingolib ${ref} from ${url} via git ls-remote"
              REV="$(git ls-remote "$url" "$ref" | awk 'NR==1{print $1}')"
            fi
          fi
          test -n "$REV"
          echo "ZINGOLIB_REV=$REV" >> "$GITHUB_ENV"
          echo "Resolved zingolib rev: $REV"

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Compute ci-build image tag from that zingolib commit
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zingolabs/zingolib zingolib-src
          git -C zingolib-src checkout "$ZINGOLIB_REV"
          TAG="$(cd zingolib-src && cargo make compute-image-tag | grep -E '^[0-9a-f]{14}$')"
          test -n "$TAG"
          echo "CI_BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Computed ci-build tag: $TAG"

      - name: Pull ci-build image
        run: podman pull docker.io/zingodevops/ci-build:${CI_BUILD_TAG}

      - name: Extract binaries & params from image
        run: |
          set -euxo pipefail
          cid=$(podman create docker.io/zingodevops/ci-build:${CI_BUILD_TAG})
          mkdir -p rust/test_binaries/bins
          podman cp "$cid":/usr/bin/zainod rust/test_binaries/bins/
          podman cp "$cid":/usr/bin/zebrad rust/test_binaries/bins/
          podman rm "$cid"

      - name: binaries env var
        run: |
          TEST_BINARIES_DIR="$(pwd)/rust/test_binaries/bins"
          echo "TEST_BINARIES_DIR=$TEST_BINARIES_DIR" >> "$GITHUB_ENV"

      # Compile the nextest harness while the APK build is still running;
      # the emulator step then reuses the warm target directory.
      - name: Prebuild test harness
        working-directory: ./rust
        run: cargo nextest run --no-run --features ci --release

      # The zingo crate's host-side unit tests (the error funnel, the
      # consent-hash parser, the channel contracts) run on the binaries the
      # prebuild just produced — effectively free here, and executed
      # nowhere else in PR CI.
      - name: Run host-side unit tests
        working-directory: ./rust
        run: cargo nextest run -p zingo --release

      # Everything above needs nothing from the APK build. Hold here
      # until its artifact lands; abort promptly if it can never land.
      - name: Wait for the APK artifact (ci-gate)
        working-directory: ./rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo run -p workbench --bin ci-gate -- \
            --artifact "android-build-outputs-${{ env.ABI }}-${{ env.CACHE-KEY }}" \
            --upstream "Android APK build" \
            --timeout-secs 2700 \
            --poll-secs 20

      - name: Download Android build outputs
        uses: actions/download-artifact@v4
        with:
          name: android-build-outputs-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: android/app/build/outputs

      - name: Run Android Integration Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          # KEEP_EMULATORS: the per-test runner script must not shut the
          # emulator down between the bucket's tests — this action boots
          # it once for the whole bucket and tears it down afterwards.
          # One line only: the emulator-runner action executes each line
          # of `script` as its own `sh -c`, so multi-line shell constructs
          # never parse.
          script: KEEP_EMULATORS=1 cargo nextest run $(for t in ${{ matrix.bucket.tests }}; do printf 'android_integration::${{ env.NEXTEST-ABI }}::%s ' "$t"; done) --features "ci" --verbose --release
          working-directory: ./rust
        env:
          TEST_BINARIES_DIR: ${{ env.TEST_BINARIES_DIR }}

      - name: Upload test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-android-integration-reports-${{ env.ABI }}-${{ matrix.bucket.name }}-${{ env.TIMESTAMP }}
          path: android/app/build/outputs/integration_test_reports
          retention-days: 7

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
