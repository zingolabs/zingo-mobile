name: Android Ubuntu Integration tests

on:
  workflow_call:
    inputs:
      timestamp:
        required: true
        type: string
      cache-key:
        required: true
        type: string
      abi:
        required: true
        type: string
      api-level:
        required: true
        type: string
      target:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, the first failure here
      # cancels the whole run, and the bucket matrix fails fast. PR CI
      # opts in; ci-nightly keeps the complete-signal default.
      fail-all:
        required: false
        type: boolean
        default: false
      # Runner label for the device test job. PR CI passes
      # CI_EMULATOR_RUNNER. The runner must
      # expose /dev/kvm. The value is one label, or a JSON array of labels
      # such as ["warp-ubuntu-latest-x64-8x", "nested-virtualization.enabled=true"].
      runner:
        required: false
        type: string
        default: ubuntu-24.04

env:
  REPO-OWNER: ${{ github.repository_owner }}
  ABI: ${{ inputs.abi }}
  API-LEVEL: ${{ inputs.api-level }}
  TARGET: ${{ inputs.target }}
  TIMESTAMP: ${{ inputs.timestamp }}

jobs:
  android-ubuntu-integration-test-ci-avd-cache:
    name: Avd Cache Integration
    runs-on: ubuntu-24.04
    env:
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: |
          echo "AVD-ARCH=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: |
          echo "AVD-ARCH=x86" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (write-only)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # Only the default branch seeds Gradle caches; PR refs write ~1 GiB
          # per job into the 10 GiB repo quota, and the resulting LRU
          # eviction has raced (and lost) same-run cache handoffs.
          cache-write-only: ${{ github.ref == 'refs/heads/dev' }}
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Check AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          lookup-only: true

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        id: avd-cache-saving
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  # Device tests: two Gradle connected-test runs on the debug build. The
  # first selects every class that carries
  # @OfflineDeviceTest. The second selects every class that carries
  # @PublicChainTest and reads mainnet or testnet through a public server.
  # The Android Test Orchestrator gives each test its own process and
  # cleared app data.
  android-device-test:
    name: offline device tests
    needs:
      - android-ubuntu-integration-test-ci-avd-cache
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    # Bounds the debug build, the emulator boot, and both test runs. Each
    # test has its own limit in android/app/build.gradle.kts.
    timeout-minutes: 40
    env:
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Restore the Binding Layer
        uses: ./.github/actions/binding-layer-android
        with:
          abi: ${{ env.ABI }}
          cache-key: ${{ env.CACHE-KEY }}

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: echo "AVD-ARCH=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: echo "AVD-ARCH=x86" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read-only off dev)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Restore AVD cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          fail-on-cache-miss: true

      - name: Run the offline device tests, then the public-chain tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          working-directory: ./android
          # The emulator runs one ABI, and the build compiles native code
          # for that ABI alone. The offline run's reports move aside before
          # the public-chain run writes its own. The public-chain run gives
          # each test 7 minutes. ExecuteSyncFromSeed and the testnet fixture
          # tests hold themselves to 5.
          script: |
            ./gradlew :app:connectedProdDebugAndroidTest -PreactNativeArchitectures=${{ env.ABI }} -Pandroid.testInstrumentationRunnerArguments.annotation=org.ZingoLabs.Zingo.OfflineDeviceTest
            mv app/build/reports/androidTests app/build/reports/androidTests-offline
            mv app/build/outputs/androidTest-results app/build/outputs/androidTest-results-offline
            ./gradlew :app:connectedProdDebugAndroidTest -PreactNativeArchitectures=${{ env.ABI }} -Pandroid.testInstrumentationRunnerArguments.annotation=org.ZingoLabs.Zingo.PublicChainTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=420000

      - name: Upload device test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-android-device-reports-${{ env.ABI }}-${{ env.TIMESTAMP }}
          path: |
            android/app/build/reports/androidTests*
            android/app/build/outputs/androidTest-results*
          retention-days: 7

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
