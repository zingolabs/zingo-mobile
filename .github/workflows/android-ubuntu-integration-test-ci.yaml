name: Android Ubuntu Integration tests

on:
  workflow_call:
    inputs:
      timestamp:
        required: true
        type: string
      cache-key:
        required: true
        type: string
      abi:
        required: true
        type: string
      api-level:
        required: true
        type: string
      target:
        required: true
        type: string

env:
  REPO-OWNER: ${{ github.repository_owner }}
  ABI: ${{ inputs.abi }}
  API-LEVEL: ${{ inputs.api-level }}
  TARGET: ${{ inputs.target }}
  TIMESTAMP: ${{ inputs.timestamp }}

jobs:
  android-ubuntu-integration-test-ci-avd-cache:
    name: Avd Cache Integration
    runs-on: ubuntu-24.04
    env:
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: |
          echo "AVD-ARCH=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: |
          echo "AVD-ARCH=x86" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (write-only)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-write-only: true
          cache-read-only: false

      - name: Check AVD cache
        uses: actions/cache/restore@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          lookup-only: true

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        id: avd-cache-saving
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ

  android-ubuntu-build:
    name: Android Ubuntu Build
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
      CACHE-KEY: ${{ inputs.cache-key }}

    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read/write)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Native rust cache
        uses: actions/cache/restore@v5
        with:
          path: android/app/src/main/jniLibs/${{ env.ABI }}
          key: native-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Kotlin uniffi cache
        uses: actions/cache/restore@v5
        with:
          path: android/app/build/generated/source/uniffi/release/java/uniffi/zingo
          key: kotlin-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}
          fail-on-cache-miss: true

      - name: Remove unnecessary directories to free up space
        run: |
          set -eux
          echo "Disk space before cleanup:"
          df -h

          sudo apt-get update

          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          podman image prune --all --force || true
          podman system prune --all --force || true

          echo "Disk space after cleanup:"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn

      - name: Run Build
        working-directory: android
        run: ./gradlew assembleProdRelease assembleProdReleaseAndroidTest -DtestBuildType=release -PsplitApk=true

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-outputs-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: |
            android/app/build/outputs

  android-ubuntu-integration-test-ci:
    name: Android Ubuntu Integration test
    needs: 
      - android-ubuntu-integration-test-ci-avd-cache
      - android-ubuntu-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: [
          "execute_version_from_seed",
          "execute_addresses_from_ufvk",
          "execute_addresses_from_seed",
          "execute_sync_from_seed",
          "execute_send_from_orchard",
          "execute_currentprice_and_value_transfers_from_seed",
          "execute_sapling_balance_from_seed",
          "execute_parse_address_for_tex",
          "execute_parse_address_invalid"
        ]
    env:
      RUSTFLAGS: -D warnings
      CACHE-KEY: ${{ inputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Set envs for x86_64
        if: ${{ env.ABI == 'x86_64' }}
        run: |
          echo "AVD-ARCH=x86_64" >> $GITHUB_ENV
          echo "NEXTEST-ABI=x86_64" >> $GITHUB_ENV

      - name: Set envs for x86
        if: ${{ env.ABI == 'x86' }}
        run: |
          echo "AVD-ARCH=x86" >> $GITHUB_ENV
          echo "NEXTEST-ABI=x86_32" >> $GITHUB_ENV

      - name: Set envs for arm64-v8a
        if: ${{ env.ABI == 'arm64-v8a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "NEXTEST-ABI=arm64" >> $GITHUB_ENV

      - name: Set envs for armeabi-v7a
        if: ${{ env.ABI == 'armeabi-v7a' }}
        run: |
          echo "AVD-ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "NEXTEST-ABI=arm32" >> $GITHUB_ENV

      - name: Grant permissions
        run: |
          sudo chmod 777 ./scripts/ci/android_integration_tests_ci.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install protoc
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: rust -> rust/target

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read-only)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-write-only: false
          cache-read-only: true

      - name: Restore AVD cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ABI }}-api-${{ env.API-LEVEL }}-integ
          fail-on-cache-miss: true

      - name: Remove unnecessary directories to free up space
        run: |
          set -eux
          echo "Disk space before cleanup:"
          df -h

          sudo apt-get update

          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          podman image prune --all --force || true
          podman system prune --all --force || true

          echo "Disk space after cleanup:"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn

      - name: Download Android build outputs
        uses: actions/download-artifact@v4
        with:
          name: android-build-outputs-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: android/app/build/outputs

      #- name: Pull ci-build image
      #  run: podman pull zingodevops/regchest:013

      - name: Pull ci-build image
        run: podman pull docker.io/zingodevops/ci-build:011

      - name: Extract binaries & params from image
        run: |
          set -euxo pipefail
          cid=$(podman create docker.io/zingodevops/ci-build:011)
          mkdir -p rust/test_binaries/bins
          podman cp "$cid":/usr/bin/lightwalletd rust/test_binaries/bins/
          podman cp "$cid":/usr/bin/zcashd       rust/test_binaries/bins/
          podman cp "$cid":/usr/bin/zcash-cli    rust/test_binaries/bins/
          podman rm "$cid"

      - name: binaries env var
        run: |
          TEST_BINARIES_DIR="$(pwd)/rust/test_binaries/bins"
          echo "TEST_BINARIES_DIR=$TEST_BINARIES_DIR" >> "$GITHUB_ENV"

      - name: Run Android Integration Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API-LEVEL }}
          arch: ${{ env.AVD-ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: cargo nextest run android_integration::${{ env.NEXTEST-ABI }}::${{ matrix.test }} --features "ci" --verbose --release
          working-directory: ./rust
        env:
          TEST_BINARIES_DIR: ${{ env.TEST_BINARIES_DIR }}

      - name: Upload test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-android-integration-reports-${{ env.ABI }}-${{ matrix.test }}-${{ env.TIMESTAMP }}
          path: android/app/build/outputs/integration_test_reports
