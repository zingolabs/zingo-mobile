name: Create cache key

on:
  workflow_call:
    outputs:
      cache-key:
        description: "Cache key"
        value: ${{ jobs.create-cache-key.outputs.cache-key }}

env:
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  create-cache-key:
    name: Create cache key
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.create-cache-key.outputs.cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      # This key decides whether the Binding Layer is rebuilt or restored, so
      # it has to name every input that changes it. Every such input lives in
      # the zingolib submodule, whose commit names them all: the crates, the
      # builder, and the builder image. Under zingolib CI the submodule is the
      # commit under test. The version prefix invalidates every entry when
      # these workflows change how they build or where they put the output.
      - name: Create cache key
        id: create-cache-key
        env:
          KEY_VERSION: binding-layer-v1
        run: echo "cache-key=${KEY_VERSION}-$(git -C zingolib rev-parse HEAD)" >> "$GITHUB_OUTPUT"
