name: Create cache key

on:
  workflow_call:
    outputs:
      cache-key:
        description: "Cache key of the Android Binding Layer"
        value: ${{ jobs.create-cache-key.outputs.cache-key }}
      ios-cache-key:
        description: "Cache key of the iOS Binding Layer"
        value: ${{ jobs.create-cache-key.outputs.ios-cache-key }}

env:
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  create-cache-key:
    name: Create cache key
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.create-cache-key.outputs.cache-key }}
      ios-cache-key: ${{ steps.create-cache-key.outputs.ios-cache-key }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      # The builders update to the newest stable toolchain before they build.
      - name: Store the stable Rust version
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --version > rust-version.txt

      # Each key decides whether one platform's Binding Layer is rebuilt or
      # restored, and it names every input that changes those libraries.
      # The zingolib commit names the crates, the builder, and the builder
      # image. Under zingolib CI the submodule is the commit under test.
      # The hash names the stable toolchain and the one workflow that runs
      # the platform's builder, so an edit to the Android workflow leaves
      # the iOS entry valid and the reverse. The version prefix invalidates
      # every entry when the output layout changes.
      - name: Create cache key
        id: create-cache-key
        env:
          KEY_VERSION: binding-layer-v1
          ANDROID_INPUTS: ${{ hashFiles('rust-version.txt', '.github/workflows/android-build.yaml') }}
          IOS_INPUTS: ${{ hashFiles('rust-version.txt', '.github/workflows/ios-build.yaml') }}
        run: |
          pin="$(git -C zingolib rev-parse HEAD)"
          echo "cache-key=${KEY_VERSION}-${pin}-${ANDROID_INPUTS}" >> "$GITHUB_OUTPUT"
          echo "ios-cache-key=${KEY_VERSION}-${pin}-${IOS_INPUTS}" >> "$GITHUB_OUTPUT"
