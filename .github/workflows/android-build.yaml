name: Build

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      arch:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure in any job here
      # cancels the whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false
      # Runner label for the native build job. The device-ABI builds
      # pass a standard runner to keep off the zingo-android-native-16
      # pool, whose cap is sized to one run.
      runner:
        required: false
        type: string
        default: zingo-android-native-16

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  ARCH: ${{ inputs.arch }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  android-check-build-cache:
    name: Check build cache
    runs-on: ubuntu-24.04
    outputs:
      binding-layer-found: ${{ steps.set-cache-found.outputs.binding-layer-found }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check if the Binding Layer cache exists
        id: check-build-cache
        uses: actions/cache/restore@v6
        with:
          path: zingolib/bindings/android/build/binding-layer
          key: binding-layer-android-${{ env.ARCH }}-${{ env.CACHE-KEY }}
          lookup-only: true

      - name: Set cache-found
        id: set-cache-found
        run: echo "binding-layer-found=${{ steps.check-build-cache.outputs.cache-hit }}" >> $GITHUB_OUTPUT

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  # The job already runs in android_builder:018, the image that zingolib's
  # builder uses, so the builder runs its plan here with --in-image instead
  # of starting a container. The output holds the ABI's two libraries and
  # the Kotlin bindings.
  android-build:
    name: Build the Binding Layer
    needs: android-check-build-cache
    if: ${{ needs.android-check-build-cache.outputs.binding-layer-found != 'true' }}
    runs-on: ${{ inputs.runner }}
    container:
      image: zingodevops/android_builder:018
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
    steps:
      # The tools that zingolib's bindings/android/docker/Dockerfile adds to
      # the image, plus protoc for the wallet crate.
      - name: Install libraries
        run: |
          apt update \
            && apt upgrade -y \
            && apt install -y --no-install-recommends --no-install-suggests \
            build-essential \
            cmake \
            golang \
            clang-18 \
            libclang-18-dev \
            protobuf-compiler \
            gcc \
            g++

      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      # The descriptor step reads the zingo-* tag that points at HEAD.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile
          fetch-tags: true

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule
        with:
          tags: true

      - name: Cargo default stable
        run: |
          rustup update
          rustup upgrade
          rustup toolchain install stable --profile minimal --component rust-src
          rustup default stable

      - name: Install bindgen-cli and cargo-ndk
        run: |
          cargo install --force --locked bindgen-cli
          cargo install --version 4.0.1 cargo-ndk

      - name: Add the ABI's Rust target
        run: |
          case "$ARCH" in
            x86_64)      rustup target add x86_64-linux-android ;;
            x86)         rustup target add i686-linux-android ;;
            arm64-v8a)   rustup target add aarch64-linux-android ;;
            armeabi-v7a) rustup target add armv7-linux-androideabi ;;
            *)           echo "unknown ABI $ARCH"; exit 1 ;;
          esac

      - name: Record zingo-mobile's descriptor
        run: |
          descriptor="$(cargo run --quiet --manifest-path rust/Cargo.toml --bin zm-descriptor)"
          echo "ZINGO_MOBILE_DESCRIPTOR=$descriptor" >> "$GITHUB_ENV"

      # The builder takes the git root of its working directory as the
      # zingolib root.
      - name: Build the Binding Layer
        working-directory: ./zingolib
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo run \
            --manifest-path tools/workbench/Cargo.toml \
            --bin build-binding-layer -- \
            android --in-image --abi "$ARCH" \
            --out bindings/android/build/binding-layer

      - name: Upload the Binding Layer
        uses: actions/upload-artifact@v7
        with:
          name: binding-layer-android-${{ env.ARCH }}-${{ env.CACHE-KEY }}
          path: zingolib/bindings/android/build/binding-layer
          retention-days: 3

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  cache-binding-layer:
    name: Cache the Binding Layer
    needs: android-build
    runs-on: ubuntu-24.04
    steps:
      - name: Download the Binding Layer
        uses: actions/download-artifact@v4
        with:
          name: binding-layer-android-${{ env.ARCH }}-${{ env.CACHE-KEY }}
          path: zingolib/bindings/android/build/binding-layer

      - name: Cache the Binding Layer
        uses: actions/cache/save@v6
        with:
          path: zingolib/bindings/android/build/binding-layer
          key: binding-layer-android-${{ env.ARCH }}-${{ env.CACHE-KEY }}

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
