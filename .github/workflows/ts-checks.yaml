name: TypeScript checks

on:
  workflow_call:

jobs:
  ts-checks:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The generated swapKitSecrets module is required for the compile;
      # without the secret (external forks) the script writes a placeholder
      # that still typechecks.
      - name: Generate SwapKit secrets module
        env:
          SWAPKIT_API_KEY: ${{ secrets.SWAPKIT_API_KEY }}
        run: ./scripts/ci/generate-swapkit-secrets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Check formatting
        run: yarn prettier:check
