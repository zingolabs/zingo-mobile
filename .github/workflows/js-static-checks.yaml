name: JS static checks

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  js-static-checks:
    name: tsc, eslint, prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Check formatting
        run: yarn prettier:check

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
