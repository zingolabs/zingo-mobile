name: JS static checks

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  js-static-checks:
    name: tsc, eslint, prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Check formatting
        run: yarn prettier:check

      # DESIGN.md mirrors app/theme ("Changing the system" in it): a PR that
      # changes a theme value changes DESIGN.md too. The label
      # design-md-unchanged lets a change with no visible effect through.
      - name: DESIGN.md moves with app/theme
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'design-md-unchanged') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          theme=$(printf '%s\n' "$changed" | grep -E '^app/theme/(tokens|radii|sizes|spacing|typography|motion)\.ts$' || true)
          if [ -n "$theme" ] && ! printf '%s\n' "$changed" | grep -qx 'DESIGN.md'; then
            echo "::error::app/theme changed without DESIGN.md: $(echo $theme)"
            echo 'Update DESIGN.md (front matter and prose) in this PR, or add the design-md-unchanged label if nothing visible changes.'
            exit 1
          fi

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
