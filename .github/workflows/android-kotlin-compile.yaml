name: Android Kotlin compile

on:
  workflow_call:
    inputs:
      # The key from create-cache-key.yaml, which names the Binding Layer
      # that android-build.yaml built for this run.
      cache-key:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-kotlin-compile:
    name: Andr Kotlin compile (fast)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The app module compiles the Binding Layer's Kotlin bindings, which
      # android-build.yaml builds with the x86_64 libraries.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Restore the Binding Layer
        uses: ./.github/actions/binding-layer-android
        with:
          abi: x86_64
          cache-key: ${{ inputs.cache-key }}

      - name: Compile release Kotlin
        working-directory: ./android
        run: ./gradlew :app:compileProdReleaseKotlin

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
