name: Android Kotlin compile

on:
  workflow_call:
    inputs:
      # The key from create-cache-key.yaml, which names the pin and the
      # toolchain that the Kotlin bindings come from.
      cache-key:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-kotlin-compile:
    name: Andr Kotlin compile (fast)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Read-only: android-dependency-analysis.yaml is the one writer of
      # the Gradle caches.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The app module compiles the Binding Layer's Kotlin bindings, which
      # the kotlin-bindings action generates on the host. This check is the
      # one that saves the host build to the cache, and the other three
      # checks restore it.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Generate the Kotlin bindings
        uses: ./.github/actions/kotlin-bindings
        with:
          cache-key: ${{ inputs.cache-key }}
          save-cache: 'true'

      - name: Compile release Kotlin
        working-directory: ./android
        run: ./gradlew :app:compileProdReleaseKotlin

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
