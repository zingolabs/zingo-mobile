name: Android Kotlin compile

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-kotlin-compile:
    name: Andr Kotlin compile (fast)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: ./.github/actions/gradle-cache

      # Gradle fetches the Binding Layer when its repository resolves. The
      # check configures the project with the fetch shadowed and fails on it.
      - name: Check that configuration runs no fetch
        run: yarn --silent check:fetch-lazy

      # The app module compiles against the Binding Layer AAR, which Gradle
      # fetches by the Bundle Pin.
      - name: Compile release Kotlin
        working-directory: ./android
        run: ./gradlew :app:compileProdReleaseKotlin

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
