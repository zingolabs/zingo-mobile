name: Android Release

# Builds the 4 ABI APKs + the universal APK on a `zingo-*` tag and attaches
# them to a fresh GitHub Release.
#
# Reliability note: this workflow does NOT read from or write to any
# cross-run `actions/cache`. The Binding Layer, the Rust libraries and their
# Kotlin bindings, is built from source on the tagged commit's zingolib
# submodule and passed between jobs via `upload-artifact` (which is
# run-scoped and disappears after the workflow finishes). The gradle
# `setup-gradle` step keeps Maven dependency caching enabled because Maven
# artifacts are content-addressed and signed — that cache cannot affect what
# code ends up in the APK.

on:
  push:
    tags:
      - 'zingo-*'

permissions:
  contents: write

jobs:
  # The job runs in android_builder:018, the image that zingolib's builder
  # uses, so the builder runs its plan here with --in-image. Each ABI's
  # output carries the same Kotlin bindings beside its two libraries.
  binding-layer:
    name: Build the Binding Layer (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container:
      image: zingodevops/android_builder:018
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, x86, arm64-v8a, armeabi-v7a]
    steps:
      - name: Install libraries
        run: |
          apt update \
            && apt upgrade -y \
            && apt install -y --no-install-recommends --no-install-suggests \
            build-essential cmake golang clang-18 libclang-18-dev protobuf-compiler gcc g++

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule
        with:
          tags: true

      - name: Cargo default stable
        run: |
          rustup update
          rustup upgrade
          rustup toolchain install stable --profile minimal --component rust-src
          rustup default stable

      - name: Install bindgen-cli and cargo-ndk
        run: |
          cargo install --force --locked bindgen-cli
          cargo install --version 4.0.1 cargo-ndk

      - name: Add the ABI's Rust target
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            x86_64)      rustup target add x86_64-linux-android ;;
            x86)         rustup target add i686-linux-android ;;
            arm64-v8a)   rustup target add aarch64-linux-android ;;
            armeabi-v7a) rustup target add armv7-linux-androideabi ;;
            *)           echo "unknown ABI $ARCH"; exit 1 ;;
          esac

      # The About screen shows this descriptor, so it names the release tag.
      - name: Record zingo-mobile's descriptor
        run: |
          descriptor="$(cargo run --quiet --manifest-path rust/Cargo.toml --bin zm-descriptor)"
          echo "ZINGO_MOBILE_DESCRIPTOR=$descriptor" >> "$GITHUB_ENV"

      # The builder finds the zingolib root from its own crate directory, so
      # it runs from the zingo-mobile root.
      - name: Build the Binding Layer
        env:
          ARCH: ${{ matrix.arch }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo run \
            --manifest-path zingolib/tools/workbench/Cargo.toml \
            --bin build-binding-layer -- \
            android --in-image --abi "$ARCH" \
            --out zingolib/bindings/android/build/binding-layer

      - name: Upload the Binding Layer
        uses: actions/upload-artifact@v7
        with:
          name: binding-layer-${{ matrix.arch }}
          path: zingolib/bindings/android/build/binding-layer

  android-release:
    name: Assemble APKs and create GitHub Release
    runs-on: ubuntu-24.04
    needs: binding-layer
    steps:
      - name: Derive channel + version + build from tag
        id: channel
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"

          # Tag formats:
          #   prod: zingo-X.Y.Z-BUILD
          #   beta: zingo-beta-X.Y.Z-BUILD
          BUILD="${TAG##*-}"             # last segment
          WITHOUT_BUILD="${TAG%-*}"      # strip -BUILD
          VERSION="${WITHOUT_BUILD##*-}" # next segment
          PREFIX="${WITHOUT_BUILD%-*}"   # the rest: zingo or zingo-beta

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"     >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}"   >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == zingo-beta-* ]]; then
            echo "channel=beta"                       >> "$GITHUB_OUTPUT"
            echo "flavor=beta"                        >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleBetaRelease"    >> "$GITHUB_OUTPUT"
            echo "apk_prefix=app-beta"                >> "$GITHUB_OUTPUT"
            echo "label=Zingo Beta"                   >> "$GITHUB_OUTPUT"
          else
            echo "channel=prod"                       >> "$GITHUB_OUTPUT"
            echo "flavor=prod"                        >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleProdRelease"    >> "$GITHUB_OUTPUT"
            echo "apk_prefix=app-prod"                >> "$GITHUB_OUTPUT"
            echo "label=Zingo"                        >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/local/graalvm/ \
                      /usr/local/share/powershell \
                      /usr/local/share/chromium \
                      /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost
          df -h

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Maven dependency caching only — content-addressed, immutable, signed
      # by upstream. No build outputs are cached cross-run.
      - name: Gradle setup (Maven dep cache only)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      # Gradle includes the Binding Layer from the zingolib submodule, and
      # takes the libraries that the binding-layer jobs built.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Download the Binding Layer (all ABIs)
        uses: actions/download-artifact@v4
        with:
          pattern: binding-layer-*
          merge-multiple: true
          path: zingolib/bindings/android/build/binding-layer

      - name: Verify the Binding Layer is present
        env:
          OUTPUT: zingolib/bindings/android/build/binding-layer
        run: |
          set -eu
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "$OUTPUT/jniLibs/${abi}/libuniffi_zingo.so"
            test -f "$OUTPUT/jniLibs/${abi}/libzingo_nym_proxy_ffi.so"
          done
          test -f "$OUTPUT/kotlin/uniffi/zingo/zingo.kt"
          test -f "$OUTPUT/kotlin/uniffi/zingo_nym_proxy_ffi/zingo_nym_proxy_ffi.kt"
          echo "ORG_GRADLE_PROJECT_bindingLayerPrebuilt=$GITHUB_WORKSPACE/$OUTPUT" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Assemble APKs (4 ABI splits + universal)
        working-directory: android
        run: ./gradlew ${{ steps.channel.outputs.gradle_task }} -PsplitApk=true -PincludeUniversalApk=true

      # R8 runs on release builds only, and every test lane builds debug, so a
      # missing -keep rule reaches users unchallenged: it happened to
      # uniffi.zingo_nym_proxy_ffi, which shipped stripped and left Mixnet Mode
      # dead in the published betas. The generated bindings are the contract;
      # this fails the release before the APKs are collected and published.
      - name: Verify R8 kept the uniffi bindings
        run: bash ./scripts/verify_uniffi_kept_by_r8.sh android/app/build/outputs/apk/${{ steps.channel.outputs.flavor }}/release/*.apk

      - name: Collect APKs
        run: |
          set -eu
          SRC="android/app/build/outputs/apk/${{ steps.channel.outputs.flavor }}/release"
          DST="release-artifacts"
          mkdir -p "$DST"
          IN_PREFIX="${{ steps.channel.outputs.apk_prefix }}"
          OUT_PREFIX="${{ steps.channel.outputs.prefix }}"
          VERSION="${{ steps.channel.outputs.version }}"
          BUILD="${{ steps.channel.outputs.build }}"
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            src_file="$SRC/${IN_PREFIX}-${abi}-release.apk"
            dst_file="$DST/${OUT_PREFIX}-${abi}-${VERSION}-${BUILD}.apk"
            if [[ ! -f "$src_file" ]]; then
              echo "missing expected APK: $src_file" >&2
              ls -la "$SRC" >&2 || true
              exit 1
            fi
            cp "$src_file" "$dst_file"
            echo "  $dst_file"
          done
          ls -la "$DST"

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.channel.outputs.label }} ${{ github.ref_name }}
          body: |
            ${{ steps.notes.outputs.result }}

            ## Zingolabs
            * @Oscar-Pepper @fluidvanadium @AloeareV @idky137 @dorianvp @nachog00 @karentaponte and @zancas making the magic behind the scenes.

            ## Manual Testing
            * Android & IOS by @edicksonjga & @juanky201271.
          files: release-artifacts/*.apk
          draft: false
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
