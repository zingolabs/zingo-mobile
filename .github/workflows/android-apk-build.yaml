name: Android APK build

# Assembles the app and androidTest APKs once per ABI, downstream of the
# native android-build. Extracted from the integration-test workflow so the
# ~14-minute Gradle assembly runs once per ABI instead of once per test
# matrix configuration.

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      abi:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not. The PR integration
      # buckets also watch this job through the ci-gate artifact gate, so
      # they abort even if the cancellation races.
      fail-all:
        required: false
        type: boolean
        default: false

env:
  REPO-OWNER: ${{ github.repository_owner }}
  ABI: ${{ inputs.abi }}

jobs:
  android-apk-build:
    name: Andr APK build
    runs-on: zingo-android-gradle-16
    env:
      RUSTFLAGS: -D warnings
      CACHE-KEY: ${{ inputs.cache-key }}

    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle setup cache (read/write)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # Only dev writes Gradle caches; see the cache-discipline notes in
          # android-ubuntu-integration-test-ci.yaml.
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      # The Actions cache is evictable under the repo quota's LRU policy —
      # an entry saved by this run's cache-native job has been evicted
      # minutes later under churn. The uploaded artifacts from this run's
      # native build are durable, so each restore falls back to its
      # artifact, and only the final presence check can fail the job.
      - name: Native rust cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: android/app/src/main/jniLibs/${{ env.ABI }}
          key: native-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}

      - name: Native rust artifact fallback
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: android/app/src/main/jniLibs/${{ env.ABI }}

      - name: Kotlin uniffi cache
        id: kotlin-cache
        uses: actions/cache/restore@v6
        with:
          path: android/app/build/generated/source/uniffi/release/java/uniffi
          key: kotlin-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}

      - name: Kotlin uniffi artifact fallback
        if: ${{ steps.kotlin-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kotlin-android-uniffi-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: android/app/build/generated/source/uniffi/release/java/uniffi

      - name: Verify native and uniffi inputs present
        run: |
          set -eu
          test -f "android/app/src/main/jniLibs/${{ env.ABI }}/libuniffi_zingo.so"
          test -f "android/app/src/main/jniLibs/${{ env.ABI }}/libzingo_nym_proxy_ffi.so"
          test -f "android/app/build/generated/source/uniffi/release/java/uniffi/zingo/zingo.kt"
          test -f "android/app/build/generated/source/uniffi/release/java/uniffi/zingo_nym_proxy_ffi/zingo_nym_proxy_ffi.kt"

      - name: Remove unnecessary directories to free up space
        run: |
          set -eux
          echo "Disk space before cleanup:"
          df -h

          sudo apt-get update

          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          podman image prune --all --force || true
          podman system prune --all --force || true

          echo "Disk space after cleanup:"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn

      - name: Run Build
        working-directory: android
        run: ./gradlew assembleProdRelease assembleProdReleaseAndroidTest -DtestBuildType=release -PsplitApk=true

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-outputs-${{ env.ABI }}-${{ env.CACHE-KEY }}
          path: |
            android/app/build/outputs
          retention-days: 3

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
