name: Android APK build

# Assembles the app and androidTest APKs once per ABI. Gradle fetches the
# Binding Layer AAR by the Bundle Pin. Extracted from the integration-test
# workflow so the ~14-minute Gradle assembly runs once per ABI instead of
# once per test matrix configuration.

on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false
      # When true, this job saves the Gradle cache that every Gradle job
      # restores. One caller passes true, the CI run of a push to the
      # default branch.
      gradle-cache-writer:
        required: false
        type: boolean
        default: false
      # Runner label for the APK build job. PR CI passes CI_GRADLE_RUNNER.
      runner:
        required: false
        type: string
        default: zingo-android-gradle-16

env:
  ABI: ${{ inputs.abi }}

jobs:
  android-apk-build:
    name: Andr APK build
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: ./.github/actions/gradle-cache
        with:
          writer: ${{ inputs.gradle-cache-writer }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Yarn install
        run: yarn setup

      - name: Run Build
        working-directory: android
        run: ./gradlew assembleProdRelease assembleProdReleaseAndroidTest -DtestBuildType=release -PsplitApk=true

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-outputs-${{ env.ABI }}
          path: |
            android/app/build/outputs
          retention-days: 3

      # setup-gradle saves the files that this job's builds used. These are
      # the tasks of the other Gradle jobs.
      - name: Fill the Gradle cache
        if: ${{ inputs.gradle-cache-writer }}
        continue-on-error: true
        working-directory: android
        run: ./gradlew --continue buildHealth :app:lintProdRelease :app:testProdReleaseUnitTest

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
