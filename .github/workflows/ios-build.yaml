name: Build

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false
      advisory:
        # Advisory mode: job failures are recorded but do not fail the
        # caller, for runs where iOS is informational (per-PR CI) rather
        # than a gate (nightly).
        required: false
        default: false
        type: boolean
      # Runner label for the build job. The CI_IOS_RUNNER repository
      # variable sets it for every caller. The fallback
      # warp-macos-15-arm64-12x is WarpBuild's 12-vCPU M4 Pro machine. The
      # org's GitHub pools are zingo-ios-build-m2 (m2-5-core) and
      # zingo-ios-build-12 (Intel), and the stock macos-15 label has three
      # cores.
      runner:
        required: false
        type: string
        default: ${{ vars.CI_IOS_RUNNER || 'warp-macos-15-arm64-12x' }}

env:
  CACHE-KEY: ${{ inputs.cache-key }}
  REPO-OWNER: ${{ github.repository_owner }}

jobs:
  ios-check-build-cache:
    name: Check build cache
    continue-on-error: ${{ inputs.advisory }}
    runs-on: macos-15
    outputs:
      ios-cache-found: ${{ steps.ios-set-cache-found.outputs.ios-cache-found }}
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Check if the Binding Layer cache exists
        id: ios-check-build-cache
        uses: actions/cache/restore@v6
        with:
          path: zingolib/bindings/swift/build
          key: binding-layer-ios-${{ env.CACHE-KEY }}
          lookup-only: true

      - name: Set cache-found
        id: ios-set-cache-found
        run: echo "ios-cache-found=${{ steps.ios-check-build-cache.outputs.cache-hit }}" >> $GITHUB_OUTPUT

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  ios-build:
    name: Build the iOS Binding Layer
    needs: ios-check-build-cache
    if: ${{ needs.ios-check-build-cache.outputs.ios-cache-found != 'true' }}
    continue-on-error: ${{ inputs.advisory }}
    runs-on: ${{ inputs.runner }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      # The descriptor step reads the zingo-* tag that points at HEAD.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile
          fetch-tags: true

      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule
        with:
          tags: true

      - name: Cargo default stable
        run: |
          rustup update
          rustup upgrade
          rustup default stable

      # Placed after the toolchain steps on purpose: rust-cache reads
      # `rustc -vV` into its key, and RUSTUP_HOME here is a workspace-relative
      # dir that has no default toolchain until the step above installs one.
      #
      # Three workspaces in the zingolib submodule: the wallet crate, the
      # proxy crate, and the workbench that runs the builder. The builder puts
      # each crate's iOS target dir under zingolib/target/binding-layer, so
      # those dirs are listed explicitly.
      #
      # What it replaces: a plain actions/cache over .cargo + rust/target that
      # never once hit. It stored 4.6 GB unpruned, the repo's cache store
      # evicted it before the next iOS build needed it, and every run logged
      # "Cache not found for input keys: ios-cargo-..." and then spent 8m30
      # re-uploading it. rust-cache prunes to dependency artifacts only, which
      # is all this job needs: zingolib and nym-sdk dominate the build, and
      # their compiled dependencies are what the cache keeps.
      #
      # Every run saves the cache. A PR reads its own entries and the dev
      # entry.
      - name: Cargo cache (registry, git, iOS targets)
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zingolib/zingo-ffi -> ../target/binding-layer/ios/wallet
            zingolib/zingo-netutils/nym-proxy-ffi -> ../../target/binding-layer/ios/proxy
            zingolib/tools/workbench

      # rust-cache reports a hit for an exact key match only. A restore
      # through a restore-key leaves the wallet target dir in place.
      - name: Record the cargo cache state
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          cargo_cache="miss"
          test -d zingolib/target/binding-layer/ios/wallet && cargo_cache="partial"
          test "$CARGO_CACHE_HIT" = "true" && cargo_cache="exact"
          echo "CARGO_CACHE=$cargo_cache" >> "$GITHUB_ENV"

      - name: Install bindgen-cli (needed by aws-lc-sys, ring etc.)
        run: cargo install --locked bindgen-cli

      - name: Install protoc
        run: brew install protobuf

      - name: Install iOS Rust targets (device + simulator)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      # this issue is solved in bindgen 0.70
      # But we have a dependency that are using a incompatible version 0.69.
      - name: Cargo env for iOS sim (bindgen/cc)
        shell: bash
        run: |
          mkdir -p .cargo
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          cat > .cargo/config.toml <<EOF
          [env]
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          CFLAGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          CXXFLAGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          EOF

      - name: Record zingo-mobile's descriptor
        run: |
          descriptor="$(cargo run --quiet --manifest-path rust/Cargo.toml --bin zm-descriptor)"
          echo "ZINGO_MOBILE_DESCRIPTOR=$descriptor" >> "$GITHUB_ENV"

      # The two XCFrameworks and the Swift sources of the ZingoBindings
      # package, which the Xcode project takes from the zingolib submodule. The
      # builder finds the zingolib root from its own crate directory, so it
      # runs from the zingo-mobile root.
      - name: Build the Binding Layer
        run: |
          started="$(date +%s)"
          cargo run \
            --manifest-path zingolib/tools/workbench/Cargo.toml \
            --bin build-binding-layer -- \
            ios --out zingolib/bindings/swift/build
          echo "BUILD_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"

      # One table row per run in the job summary.
      - name: Report the build in the job summary
        env:
          RUNNER: ${{ inputs.runner }}
        run: |
          minutes="$(( BUILD_SECONDS / 60 ))"
          seconds="$(( BUILD_SECONDS % 60 ))"
          printf '%s\n' \
            "## iOS Binding Layer" \
            "" \
            "| Runner | Cargo cache | Build time | Descriptor | zingolib |" \
            "|---|---|---|---|---|" \
            "| $RUNNER | $CARGO_CACHE | ${minutes}m ${seconds}s | $ZINGO_MOBILE_DESCRIPTOR | $(git -C zingolib rev-parse --short HEAD) |" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Binding Layer
        uses: actions/upload-artifact@v7
        with:
          name: binding-layer-ios-${{ env.CACHE-KEY }}
          path: zingolib/bindings/swift/build
          retention-days: 3

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  cache-binding-layer-ios:
    name: Cache the iOS Binding Layer
    needs: ios-build
    continue-on-error: ${{ inputs.advisory }}
    runs-on: macos-15
    steps:
      - name: Set envs for zingolib CI
        if: ${{ contains(github.repository, 'zingolib') }}
        run: echo "REPO-OWNER=zingolabs" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO-OWNER }}/zingo-mobile

      - name: Download the Binding Layer
        uses: actions/download-artifact@v4
        with:
          name: binding-layer-ios-${{ env.CACHE-KEY }}
          path: zingolib/bindings/swift/build

      - name: Cache the Binding Layer
        uses: actions/cache/save@v6
        with:
          path: zingolib/bindings/swift/build
          key: binding-layer-ios-${{ env.CACHE-KEY }}

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
