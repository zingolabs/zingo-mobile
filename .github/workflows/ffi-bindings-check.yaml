name: FFI bindings check

on:
  workflow_call:

jobs:
  ffi-bindings-check:
    name: Committed bindings match the wallet crate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust stable
        run: rustup default stable

      - name: Cache the wallet and shim builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/nym-proxy-ffi/target
          key: ffi-bindings-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/nym-proxy-ffi/Cargo.lock') }}

      - name: Regenerate the bindings and diff the committed ones
        run: node scripts/generate_bindings.mjs --check
