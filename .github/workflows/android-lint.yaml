name: Android lint

on:
  workflow_call:
    inputs:
      # The key from create-cache-key.yaml, which names the pin and the
      # toolchain that the Kotlin bindings come from.
      cache-key:
        required: true
        type: string
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  android-lint:
    name: Andr lint (fast)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: ./.github/actions/gradle-cache

      # The lint below is the same script developers run locally, so a green
      # CI lint and a green local lint mean the same thing. Both take the
      # Kotlin bindings that the builder's kotlin mode generates on the host.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Generate the Kotlin bindings
        uses: ./.github/actions/kotlin-bindings
        with:
          cache-key: ${{ inputs.cache-key }}

      - name: Lint release
        run: yarn lint:android

      - name: Upload lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-prodRelease
          path: android/app/build/reports/lint-results-prodRelease.*
          if-no-files-found: warn

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
