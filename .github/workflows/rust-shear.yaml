name: Rust unused dependencies

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  rust-shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned so a new shear release cannot fail CI on untouched code.
      - name: Install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.13.2

      - name: Check for unused dependencies
        working-directory: ./rust
        run: cargo shear

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
