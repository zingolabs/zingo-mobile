name: CI

on:
  pull_request:
  push:
    branches: [main, dev, stable]
  workflow_dispatch:

# A new push to a PR supersedes the in-flight run, so cancel it and free its
# runners; cancelling the caller run also cancels every reusable-workflow job
# it fanned out. Mainline pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: write lets the fail-all steps in the blocking jobs cancel this
# run, and lets ci-gate read the run's artifact and job listings. Fork
# PRs get a read-only token regardless; there the cancel step fails
# harmlessly inside an already-failing job.
permissions:
  contents: read
  actions: write

jobs:
  # Every blocking check opts into fail-all: its first failure cancels
  # the whole run (see CONTEXT.md). Nightly leaves fail-all off to keep
  # the complete picture.

  # The four Gradle checks below compile against the Kotlin bindings that
  # the kotlin-bindings action generates on the host at workflow launch.
  # They start before any cross build and finish while andr-build runs.

  # Catches app-module Kotlin compile breakage (e.g. classpath conflicts) in
  # a few minutes, long before the emulator jobs report.
  andr-kotlin-compile:
    uses: ./.github/workflows/android-kotlin-compile.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      fail-all: true

  # Static analysis of the app module. NewApi is the one that matters here:
  # nothing else in CI catches a call above minSdk, and those only surface
  # as a crash on a user's older device.
  andr-lint:
    uses: ./.github/workflows/android-lint.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      runner: ${{ vars.CI_GRADLE_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  # The plain-JVM bridge-contract tests (FfiOutcome, FfiArgs): the only
  # executable tests of the Kotlin bridge, so they gate the PR alongside
  # the compile check.
  andr-unit-test:
    uses: ./.github/workflows/android-unit-test.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      fail-all: true

  jest-test:
    uses: ./.github/workflows/jest-test.yaml
    secrets: inherit
    with:
      fail-all: true

  rust-shear:
    uses: ./.github/workflows/rust-shear.yaml
    with:
      fail-all: true

  workbench-test:
    uses: ./.github/workflows/workbench-test.yaml
    with:
      fail-all: true

  # zingolib's CI leaves the wallet crate and the proxy crate untested, and
  # this job tests both at the pinned commit.
  binding-layer-check:
    uses: ./.github/workflows/binding-layer-check.yaml
    with:
      fail-all: true

  js-depcheck:
    uses: ./.github/workflows/js-depcheck.yaml
    with:
      fail-all: true

  # tsc, eslint and prettier --check. A rename-heavy PR is what this gate
  # catches: a stale import path or an unformatted file that jest never
  # loads.
  js-static-checks:
    uses: ./.github/workflows/js-static-checks.yaml
    with:
      fail-all: true

  andr-dependency-analysis:
    uses: ./.github/workflows/android-dependency-analysis.yaml
    needs: create-cache-key
    secrets: inherit
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      runner: ${{ vars.CI_GRADLE_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  create-timestamp:
    uses: ./.github/workflows/create-timestamp.yaml

  create-cache-key:
    uses: ./.github/workflows/create-cache-key.yaml

  # PR CI executes tests on the emulator ABI (x86_64 / API 34), not the
  # device ABIs: KVM accelerates an AVD only when the guest matches the
  # x86_64 host, so arm64-v8a and armeabi-v7a can never run on hosted
  # runners. The x86 / API 29 emulator lane runs on ci-nightly.
  andr-build:
    strategy:
      matrix:
        arch: [ x86_64 ]
    uses: ./.github/workflows/android-build.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      arch: ${{ matrix.arch }}
      runner: ${{ vars.CI_NATIVE_RUNNER || 'zingo-android-native-16' }}
      fail-all: true

  # The other three ABIs cross-compile per PR: proof that the Rust code
  # still builds for the device ABIs and 32-bit x86 without waiting for
  # ci-nightly. They block like every other check. The standard-runner
  # fallback keeps these off the zingo-android-native-16 pool; the
  # per-arch caches make them no-ops on pushes that leave the zingolib
  # pin untouched.
  andr-build-other-abis:
    strategy:
      matrix:
        arch: [ x86, arm64-v8a, armeabi-v7a ]
    uses: ./.github/workflows/android-build.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      arch: ${{ matrix.arch }}
      runner: ${{ vars.CI_NATIVE_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  andr-apk-build:
    uses: ./.github/workflows/android-apk-build.yaml
    needs: [create-cache-key, andr-build]
    with:
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      abi: x86_64
      runner: ${{ vars.CI_GRADLE_RUNNER || 'zingo-android-gradle-16' }}
      fail-all: true

  # The device tests need the Binding Layer and build their own debug
  # app, and they start beside andr-apk-build.
  andr-ubu-integra-test-ci:
    strategy:
      matrix:
        config:
          - { abi: x86_64, api-level: 34, target: default }
    uses: ./.github/workflows/android-ubuntu-integration-test-ci.yaml
    # The offline device test job builds the debug app in the job, and
    # that build packages the Binding Layer that andr-build produces.
    needs: [create-timestamp, create-cache-key, andr-build]
    secrets: inherit
    with:
      timestamp: ${{ needs.create-timestamp.outputs.timestamp }}
      cache-key: ${{ needs.create-cache-key.outputs.cache-key }}
      abi: ${{ matrix.config.abi }}
      api-level: ${{ matrix.config['api-level'] }}
      target: ${{ matrix.config.target }}
      runner: ${{ vars.CI_EMULATOR_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  # iOS starts at workflow launch, in parallel with the Android chain,
  # and its jobs are blocking checks.
  ios-build:
    uses: ./.github/workflows/ios-build.yaml
    needs: create-cache-key
    with:
      cache-key: ${{ needs.create-cache-key.outputs.ios-cache-key }}
      fail-all: true

  # The test job starts at workflow launch and front-loads its setup. On
  # a cache miss it holds at the ci-gate artifact gate until the Binding
  # Layer artifact lands.
  ios-integration-test:
    uses: ./.github/workflows/ios-integration-test.yaml
    needs: create-cache-key
    secrets: inherit
    with:
      cache-key: ${{ needs.create-cache-key.outputs.ios-cache-key }}
      fail-all: true
