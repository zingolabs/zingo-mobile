name: CI

on:
  pull_request:
  push:
    branches: [main, dev, stable]
  workflow_dispatch:

# A new push to a PR supersedes the in-flight run, so cancel it and free its
# runners; cancelling the caller run also cancels every reusable-workflow job
# it fanned out. Mainline pushes are never cancelled. Each mainline commit
# has its own group. A shared group keeps one pending run and cancels an
# older pending run, and that run's cache saves never happen.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: write lets the fail-all steps in the blocking jobs cancel this
# run, and lets the artifact gate read the run's artifact and job listings. Fork
# PRs get a read-only token regardless; there the cancel step fails
# harmlessly inside an already-failing job.
permissions:
  contents: read
  actions: write

jobs:
  # Every blocking check opts into fail-all: its first failure cancels
  # the whole run (see CONTEXT.md). Nightly leaves fail-all off to keep
  # the complete picture.

  # The Bundle Pin at binding-layer.json names the two Prebuilt Bundles
  # (zingo-mobile/0020). One required job per platform fetches by digest
  # and checks the registry's tag. Every Gradle and Xcode job fetches for
  # itself by an anonymous pull verified by digest.
  binding-layer-android:
    uses: ./.github/workflows/binding-layer-fetch.yaml
    with:
      platform: android
      fail-all: true

  binding-layer-ios:
    uses: ./.github/workflows/binding-layer-fetch.yaml
    with:
      platform: ios
      fail-all: true

  # The four Gradle checks below compile against the Binding Layer AAR
  # that Gradle fetches by the Bundle Pin. They start at workflow launch.

  # Catches app-module Kotlin compile breakage (e.g. classpath conflicts) in
  # a few minutes, long before the emulator jobs report.
  andr-kotlin-compile:
    uses: ./.github/workflows/android-kotlin-compile.yaml
    with:
      fail-all: true

  # Static analysis of the app module. NewApi is the one that matters here:
  # nothing else in CI catches a call above minSdk, and those only surface
  # as a crash on a user's older device.
  andr-lint:
    uses: ./.github/workflows/android-lint.yaml
    with:
      runner: ${{ vars.CI_GRADLE_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  # The plain-JVM bridge-contract tests (FfiOutcome, FfiArgs): the only
  # executable tests of the Kotlin bridge, so they gate the PR alongside
  # the compile check.
  andr-unit-test:
    uses: ./.github/workflows/android-unit-test.yaml
    with:
      fail-all: true

  jest-test:
    uses: ./.github/workflows/jest-test.yaml
    secrets: inherit
    with:
      fail-all: true

  js-depcheck:
    uses: ./.github/workflows/js-depcheck.yaml
    with:
      fail-all: true

  # jscpd against the base branch. A PR that adds duplicated TypeScript,
  # Kotlin or Swift fails here (see AGENTS.md, "No duplicated code").
  code-duplication:
    uses: ./.github/workflows/code-duplication.yaml
    with:
      fail-all: true

  # tsc, eslint and prettier --check. A rename-heavy PR is what this gate
  # catches: a stale import path or an unformatted file that jest never
  # loads.
  js-static-checks:
    uses: ./.github/workflows/js-static-checks.yaml
    with:
      fail-all: true

  andr-dependency-analysis:
    uses: ./.github/workflows/android-dependency-analysis.yaml
    secrets: inherit
    with:
      runner: ${{ vars.CI_GRADLE_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  create-timestamp:
    uses: ./.github/workflows/create-timestamp.yaml

  # PR CI executes tests on the emulator ABI (x86_64 / API 34), not the
  # device ABIs: KVM accelerates an AVD only when the guest matches the
  # x86_64 host, so arm64-v8a and armeabi-v7a can never run on hosted
  # runners. The x86 / API 29 emulator lane runs on ci-nightly. The AAR
  # carries every ABI, so the device ABIs need no build of their own.
  andr-apk-build:
    uses: ./.github/workflows/android-apk-build.yaml
    with:
      abi: x86_64
      runner: ${{ vars.CI_GRADLE_RUNNER || 'zingo-android-gradle-16' }}
      fail-all: true
      gradle-cache-writer: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}

  # The device tests build their own debug app, which fetches the
  # Binding Layer, and they start beside andr-apk-build.
  andr-ubu-integra-test-ci:
    strategy:
      matrix:
        config:
          - { abi: x86_64, api-level: 34, target: default }
    uses: ./.github/workflows/android-ubuntu-integration-test-ci.yaml
    needs: create-timestamp
    secrets: inherit
    with:
      timestamp: ${{ needs.create-timestamp.outputs.timestamp }}
      abi: ${{ matrix.config.abi }}
      api-level: ${{ matrix.config['api-level'] }}
      target: ${{ matrix.config.target }}
      runner: ${{ vars.CI_EMULATOR_RUNNER || 'ubuntu-24.04' }}
      fail-all: true

  # iOS starts at workflow launch, in parallel with the Android chain,
  # and fetches the iOS Prebuilt Bundle itself.
  ios-integration-test:
    uses: ./.github/workflows/ios-integration-test.yaml
    secrets: inherit
    with:
      fail-all: true
