name: Workbench tests

on:
  workflow_call:
    inputs:
      # Fail-all (see CONTEXT.md): when true, a failure here cancels the
      # whole run. PR CI opts in; ci-nightly does not.
      fail-all:
        required: false
        type: boolean
        default: false

jobs:
  # Unit tests of ci-gate and zm-descriptor, the tools that gate the
  # integration buckets and name the builds.
  workbench-test:
    name: workbench tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The harness workspace takes zingolib_testutils by path from the
      # submodule, and cargo reads that manifest to resolve the workspace.
      - name: Check out zingolib
        uses: ./.github/actions/zingolib-submodule

      - name: Cache the workbench build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: workbench-tests-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.98

      - name: Update the stable toolchain
        run: rustup update stable

      - name: Tests
        working-directory: ./rust
        run: cargo nextest run --package workbench

      - name: Cancel the run on failure (fail-all)
        if: ${{ failure() && inputs.fail-all }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
