name: Kotlin bindings
description: >
  Generates the Binding Layer's Kotlin sources on the host with the
  builder's kotlin mode, and points Gradle at them. The Gradle checks
  compile against the sources and need no native library. The zingolib
  submodule is checked out before this action runs.

inputs:
  cache-key:
    description: The key from create-cache-key.yaml.
    required: true
  save-cache:
    description: >
      Whether this job saves the host build to the cache. The four Gradle
      checks generate the same bindings in parallel, so one of them saves
      and the others only restore.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # zingo-netutils reaches lightwallet-protocol, whose build script
    # generates its prost bindings with protoc.
    - name: Install protobuf-compiler
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # The proxy crate's host build and the bindgen binaries. The key
    # follows the Binding Layer's, which names the pin and the toolchain.
    # The restore key takes the newest entry for any pin, so a pin bump
    # rebuilds only what changed. The paths leave out the registry's
    # extracted sources, which cargo re-extracts from the crate archives.
    - name: Restore the host build
      id: host-build-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          zingolib/target/binding-layer/host
        key: kotlin-host-build-${{ runner.os }}-${{ inputs.cache-key }}
        restore-keys: kotlin-host-build-${{ runner.os }}-

    # RUSTUP_TOOLCHAIN overrides zingolib's toolchain pin for the workbench
    # build, and the builder sets the same toolchain for its own steps.
    # CARGO_INCREMENTAL keeps the incremental state out of the cached
    # target directory, which nothing edits between runs.
    - name: Generate the Kotlin bindings
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: stable
        CARGO_INCREMENTAL: '0'
      run: |
        cargo run \
          --manifest-path zingolib/tools/workbench/Cargo.toml \
          --bin build-binding-layer -- \
          kotlin --out zingolib/bindings/android/build/binding-layer

    - name: Save the host build
      if: ${{ inputs.save-cache == 'true' && steps.host-build-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          zingolib/target/binding-layer/host
        key: kotlin-host-build-${{ runner.os }}-${{ inputs.cache-key }}

    - name: Verify the Kotlin bindings are present
      shell: bash
      env:
        OUTPUT: zingolib/bindings/android/build/binding-layer
      run: |
        set -eu
        test -f "$OUTPUT/kotlin/uniffi/zingo/zingo.kt"
        test -f "$OUTPUT/kotlin/uniffi/zingo_nym_proxy_ffi/zingo_nym_proxy_ffi.kt"

    # Gradle reads ORG_GRADLE_PROJECT_<name> as the project property <name>,
    # and the included Binding Layer build then skips its own build.
    - name: Point Gradle at the Kotlin bindings
      shell: bash
      run: echo "ORG_GRADLE_PROJECT_bindingLayerPrebuilt=$GITHUB_WORKSPACE/zingolib/bindings/android/build/binding-layer" >> "$GITHUB_ENV"
