<svg viewBox="0 0 900 400" role="img" aria-label="Re-render cascade from one sync tick" xmlns="http://www.w3.org/2000/svg"><style>
  :root {
    --bg: #fbfbfa; --fg: #1d1d1b; --muted: #5f5f5a; --line: #d9d9d3;
    --box: #ffffff; --accent: #b3421b; --accent2: #1f5f8b; --warn: #fff3e8; --ok: #eef6ee;
    --code: #f1f1ec; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ebebe6; --muted: #a3a39c; --line: #3a3a36; --box: #1f1f1d;
            --accent: #f08a5d; --accent2: #7db6dc; --warn: #2b211a; --ok: #1c261c; --code: #23231f; }
  }
  html { font-size: 17px; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.55; }
  main { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.45rem; margin: 3rem 0 .75rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  h3 { font-size: 1.1rem; margin: 1.75rem 0 .5rem; }
  p { margin: .6rem 0 .9rem; }
  .lede { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.5rem; }
  code { font-family: var(--mono); font-size: .88em; background: var(--code); padding: .08em .35em; border-radius: 4px; }
  pre { background: var(--code); padding: .9rem 1rem; border-radius: 6px; overflow-x: auto; font-size: .85rem; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: 1em; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  .note { border-left: 4px solid var(--accent2); background: var(--box); padding: .7rem 1rem; margin: 1rem 0; border-radius: 0 6px 6px 0; }
  .bad  { border-left: 4px solid var(--accent);  background: var(--warn); padding: .7rem 1rem; margin: 1rem 0; border-radius: 0 6px 6px 0; }
  .good { border-left: 4px solid #3d8b4f; background: var(--ok); padding: .7rem 1rem; margin: 1rem 0; border-radius: 0 6px 6px 0; }
  .term { display: grid; grid-template-columns: 11rem 1fr; gap: .4rem 1rem; margin: 1rem 0; }
  .term dt { font-weight: 600; }
  .term dd { margin: 0; }
  figure { margin: 1.5rem 0; }
  figcaption { color: var(--muted); font-size: .88rem; margin-top: .5rem; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--fg); }
  svg .mono { font-family: var(--mono); }
  svg .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
  svg .hot { fill: var(--warn); stroke: var(--accent); stroke-width: 1.4; }
  svg .cold { fill: var(--ok); stroke: #3d8b4f; }
  svg .edge { stroke: var(--muted); stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  svg .edge.hot { stroke: var(--accent); fill: none; }
  svg .lbl { font-size: 11px; fill: var(--muted); }
  svg .t { font-size: 13px; }
  svg .b { font-size: 13px; font-weight: 600; }
  svg .s { font-size: 11px; }
  .stack { display: flex; flex-direction: column; gap: 0; margin: 1.25rem 0; }
  .stack .layer { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .9rem; }
  .stack .layer.hot { border-color: var(--accent); background: var(--warn); }
  .stack .layer b { display: block; }
  .stack .layer span { color: var(--muted); font-size: .9rem; }
  .stack .arrow { text-align: center; color: var(--muted); font-size: .85rem; padding: .15rem 0; }
  ul, ol { padding-left: 1.4rem; }
  li { margin: .3rem 0; }
  .small { font-size: .9rem; color: var(--muted); }
  a { color: var(--accent2); }
</style>
  <rect x="20" y="30" width="180" height="56" rx="8" class="box"/>
  <text x="110" y="52" text-anchor="middle" class="b">setInterval, 5 s</text>
  <text x="110" y="72" text-anchor="middle" class="s">SyncCoordinator:62</text>

  <rect x="250" y="20" width="220" height="76" rx="8" class="box"/>
  <text x="360" y="42" text-anchor="middle" class="b">runTaskPromises</text>
  <text x="360" y="60" text-anchor="middle" class="s">up to 8 FFI calls + doSave()</text>
  <text x="360" y="78" text-anchor="middle" class="s">each: JSON.parse, transform, callback</text>

  <rect x="520" y="20" width="360" height="76" rx="8" class="hot"/>
  <text x="700" y="42" text-anchor="middle" class="b">LoadedAppClass setters</text>
  <text x="700" y="60" text-anchor="middle" class="s">setSyncingStatus, setInfo, setTotalBalance, setAllAddresses,</text>
  <text x="700" y="78" text-anchor="middle" class="s">setValueTransfersList, setMessagesList, setBirthday</text>

  <rect x="520" y="130" width="360" height="56" rx="8" class="hot"/>
  <text x="700" y="152" text-anchor="middle" class="b">lodash isEqual on each payload</text>
  <text x="700" y="170" text-anchor="middle" class="s">deep walk of the full transaction list, on the JS thread</text>

  <rect x="520" y="220" width="360" height="56" rx="8" class="hot"/>
  <text x="700" y="242" text-anchor="middle" class="b">this.setState × N (N ≥ 1 while syncing)</text>
  <text x="700" y="260" text-anchor="middle" class="s">syncingStatus differs every tick; render() of a 2,030-line class</text>

  <rect x="520" y="310" width="360" height="56" rx="8" class="hot"/>
  <text x="700" y="332" text-anchor="middle" class="b">New context object → 47 subscribers render</text>
  <text x="700" y="350" text-anchor="middle" class="s">plus every child under them without React.memo (84 of 109 files)</text>

  <rect x="20" y="220" width="450" height="146" rx="8" class="box"/>
  <text x="30" y="242" class="b">Side effects of the class rendering</text>
  <text x="30" y="264" class="s">• Every {props => …} render callback in the navigator is a new closure.</text>
  <text x="30" y="282" class="s">• toggleMenuDrawer={() => toggleOptionsPanel()} is a new function per render,</text>
  <text x="30" y="298" class="s">   which defeats React.memo on History, Send, Receive.</text>
  <text x="30" y="316" class="s">• A useEffect is declared inside a render prop of a class (line 2367).</text>
  <text x="30" y="334" class="s">• setValueTransfersList defers its own setState by 250 ms with setTimeout</text>
  <text x="30" y="352" class="s">   "so the UI has time to accommodate the bottom tabs" (line 1490).</text>

  <path d="M200 58 L248 58" class="edge"/>
  <path d="M470 58 L518 58" class="edge"/>
  <path d="M700 96 L700 128" class="edge"/>
  <path d="M700 186 L700 218" class="edge"/>
  <path d="M700 276 L700 308" class="edge"/>
</svg>