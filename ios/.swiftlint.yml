# SwiftLint configuration (zingo-mobile#1166). Findings that predate
# adoption live in swiftlint-baseline.json — CI passes --baseline, so only
# new or changed Swift is enforced. Shrink the baseline over time, never
# grow it.
excluded:
  - Pods
  - build
  - DerivedData

opt_in_rules:
  # DRY and functional-shape rules beyond the default set
  - closure_body_length
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - last_where
  - reduce_into
  - sorted_first_last
  - toggle_bool
