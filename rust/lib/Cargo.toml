[package]
name = "zingo"
version = "2.0.0"
authors = ["Zingolabs <zingo@zingolabs.com>"]
edition = "2024"

[features]
ci = []
regchest = []

[dependencies]

zingo-netutils = { workspace = true }
zingo_common_components = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "9a9d79b5f4c9deb2a508cb02c457223b8c43174d" }
zingolib = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "9a9d79b5f4c9deb2a508cb02c457223b8c43174d", default-features = true, features = [
    "testutils",
] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "9a9d79b5f4c9deb2a508cb02c457223b8c43174d" }

zcash_encoding = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "std",
] }
zcash_address = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "std",
] }
zcash_client_backend = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_keys = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
    "std",
] }
zcash_primitives = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "std",
] }
zcash_proofs = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57" }
zcash_protocol = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "std",
    "local-consensus",
] }
zcash_transparent = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "315b72497f9611267c0c6d9d44ad893af8c17d57", features = [
    "std",
] }

zcash_note_encryption = "0.4"
http = "1"
json = "0.12"
lazy_static = "1.4.0"
hex = "0.4"
android_logger = "0.11"
base64 = "0.22"
log = "0.4"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
bip0039 = { version = "0.13.4", features = ["rand"] }
thiserror = "1"
once_cell = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[build-dependencies]
uniffi_build = { version = "0.29", features = ["builtin-bindgen"] }

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zingo"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]
