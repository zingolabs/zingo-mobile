[package]
name = "zingo"
version = "2.0.0"
authors = ["Zingolabs <zingo@zingolabs.com>"]
edition = "2024"

[dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "d382ff22963fdf2d4ed641c9886d567b32f613da", default-features = true, features = [
    "testutils",
] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "d382ff22963fdf2d4ed641c9886d567b32f613da" }

zcash_address = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }
zcash_client_backend = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_encoding = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }
zcash_keys = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4"
zcash_primitives = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }
zcash_proofs = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }
zcash_protocol = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }
zcash_transparent = { git = "https://github.com/zingolabs/librustzcash", rev = "ab1965d62f8500449389e473a08a06de3193648c" }

zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", branch = "dev" }

http = "1"
json = "0.12"
lazy_static = "1.4.0"
hex = "0.4"
android_logger = "0.11"
base64 = "0.22"
log = "0.4"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
bip0039 = { version = "0.12", features = ["rand"] }
thiserror = "1"
once_cell = "1"


[build-dependencies]
uniffi_build = { version = "0.29", features = ["builtin-bindgen"] }

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zingo"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]
