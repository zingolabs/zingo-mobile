[package]
name = "zingo-nym-proxy-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI shim hosting the Nym mixnet SOCKS5 proxy for mobile (ADR 0011, CP-3)."

# The mobile host loads this as a dynamic library (cdylib for the loaded
# framework) or links it statically (staticlib for the iOS XCFramework slices).
# rlib keeps it usable as an ordinary dependency for host-side tests.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# NymProxy lives here, behind the nym feature; this shim always needs it.
# Pinned to the nym_bootstrap_events head (PR 2742) for BootstrapEvent;
# retarget to the next zingolib tag once that PR merges.
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", rev = "8fc056a945e24fa5d36d274aed5d1cf5b725fafa", features = [
    "nym",
] }
# Proc-macro scaffolding (setup_scaffolding! + #[uniffi::export]); no build.rs
# and no UDL. Generating the Swift/Kotlin bindings is a later, separate step.
uniffi = "0.28"
# The shim owns a long-lived runtime that keeps the NymProxy client and its
# SOCKS5 listener alive across start and stop.
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
thiserror = "2"
tracing = "0.1.44"
# The diagnostics surface (ADR 0007): SOCKS5 tunnelling for the probes, TLS
# for the destination arm (verifying against the patched Mozilla-bundle
# verifier, ADR 0006), and the tracing capture layer.
tokio-socks = { version = "0.5", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "ring",
] }
rustls-platform-verifier = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = [
    "registry",
    "std",
] }

[features]
# Builds tests/live_mixnet.rs, which reaches the real Nym network.
live-mixnet = []
# The three-leg observation surface (ADR 0007): the tracing capture layer,
# the Sentinel and destination probes, and the observed bootstrap. Only
# debug wallet builds enable it; release binaries never carry it.
diagnostics = [
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
    "dep:tokio-socks",
    "dep:tracing-subscriber",
    "zingo-netutils/socks5-transmit",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# The tests read their temporal parameters from `time::test`.
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", rev = "8fc056a945e24fa5d36d274aed5d1cf5b725fafa", features = [
    "testutils",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4.33"
tracing-subscriber = "0.3.23"

# This crate resolves in its own lockfile, never the parent workspace's:
# nym-sdk's transitive graph needs `crypto-common ^0.2`, irreconcilable
# with the main workspace's pins (see the root manifest's exclude).
[workspace]
members = []

# Cargo honours `[patch]` only from the workspace being built, so zingolib's
# own stanza never reaches this workspace and the nym stack would otherwise
# resolve the real `rustls-platform-verifier`. On Android that verifier
# rejects `validator.nymtech.net` for carrying no OCSP responder, and the
# mixnet never starts. This restates zingolib ADR 0021 here: verification is
# the compiled-in Mozilla bundle, identically on every platform.
[patch.crates-io]
rustls-platform-verifier = { git = "https://github.com/zingolabs/zingolib", tag = "zingolib_nym_rc0" }
