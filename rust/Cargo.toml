[workspace]
members = ["lib", "android", "ios", "zingomobile_utils"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib", branch = "feat/ironwood" }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", branch = "feat/ironwood" }
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", branch = "feat/ironwood" }
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", branch = "feat/ironwood", features = [
    "test_lwd_zcashd",
] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.13.0-pre.0"
zcash_client_backend = { version = "0.23", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4"
zcash_keys = { version = "0.15.0-pre.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4"
zcash_proofs = "0.29.0-pre.0"
zcash_protocol = "0.10.0-pre.0"
zcash_transparent = "0.9.0-pre.0"

bip0039 = { version = "0.14", features = ["rand"] }
zip32 = "0.2.0"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

# The `feat/ironwood` zingolib workspace requires these source patches
# (librustzcash Ironwood stack, zebra Ironwood fork, lightwallet-protocol with
# Ironwood proto fields). A dependency's own `[patch]` table is ignored by
# cargo, so they must be replicated in this top-level workspace.
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }

lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

# The zingolib feat/ironwood workspace points these at the (since-deleted)
# `nu63-ironwood` branch; this is the rev its lockfile pins.
zebra-chain = { git = "https://github.com/zcashfoundation/zebra", rev = "f5a3073afd69fdcaf452efb89f669f7c276809bc" }
zebra-rpc = { git = "https://github.com/zcashfoundation/zebra", rev = "f5a3073afd69fdcaf452efb89f669f7c276809bc" }
zebra-node-services = { git = "https://github.com/zcashfoundation/zebra", rev = "f5a3073afd69fdcaf452efb89f669f7c276809bc" }

zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_history = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
equihash = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }

[profile.release]
debug = 1
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
