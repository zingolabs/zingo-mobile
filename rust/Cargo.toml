[workspace]
members = ["lib", "android", "ios", "zingomobile_utils", "workbench"]
resolver = "2"

[workspace.dependencies]
# Pinned by rev, never branch (ADR 0024 decision 7). The rev is the
# convergence stack's phase1-dep-funnel head, carrying the five-state
# Mixnet Mode wire mint, the session driver, the mixnet-only price rule,
# and the netutils funnel. Later PRs advance the pin along zingolib's own
# history. The `nym` feature enables the Mixnet Mode surface.
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "53e806f4733cd63f3dac4ddbe9b868b9a298f0de", features = [
    "nym",
] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", rev = "53e806f4733cd63f3dac4ddbe9b868b9a298f0de" }
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", rev = "53e806f4733cd63f3dac4ddbe9b868b9a298f0de", features = [
    # The scenarios record clearnet consent before their funding sends,
    # which the five-state wallet demands of any sender (ADR 0011).
    "nym",
] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "0.15.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_protocol = "0.10.0"

zingo_common_components = "0.4.0"
# No direct zingo-netutils dependency: the app funnels through zingolib's
# re-exports (zingolib::netutils, ADR 0024 decision 7). This retires the
# crates.io duplicate copy that compiled without the SOCKS5 capability
# (zingo-mobile#1236, zingolib#2566).
zip32 = "0.2.0"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1

[patch.crates-io]
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). Must match
# the patch in zingolib (feat/ironwood) so the dependency graph resolves to a single
# ironwood-aware lightwallet-protocol.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
