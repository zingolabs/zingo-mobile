[workspace]
members = ["lib"]
resolver = "2"

exclude = ["android", "ios", "zingodelegator_utils"]

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib-crosslink", default-features = true, rev = "e1ea7a1c59e131a475fe26fb6c994b5875565ce8", features = [
    "testutils",
] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "e1ea7a1c59e131a475fe26fb6c994b5875565ce8" }
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "e1ea7a1c59e131a475fe26fb6c994b5875565ce8", features = [
    "test_lwd_zcashd",
] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingodelegator_utils = { path = "zingodelegator_utils" }

zcash_encoding = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "std",
] }
zcash_address = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "std",
] }
zcash_client_backend = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_keys = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
    "std",
] }
zcash_primitives = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "std",
] }
zcash_proofs = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93" }
zcash_protocol = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "std",
    "local-consensus",
] }
zcash_transparent = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "4c9567b7bd2a62cad5a5523f08a584d3f70e7b93", features = [
    "std",
] }

zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", branch = "dev" }

bip0039 = { version = "0.12", features = ["rand"] }
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[patch.crates-io]
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8" }

[profile.release]
debug = 1
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
