[workspace]
members = ["lib"]
resolver = "2"

exclude = ["android", "ios", "zingodelegator_utils"]

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "2f6365594ce7d73803415d89a71456e038a255df", default-features = true, features = [
    "testutils",
] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib-crosslink", rev = "2f6365594ce7d73803415d89a71456e038a255df" }

zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", tag = "2.0.9", features = [
    "test_lwd_zcashd",
] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingodelegator_utils = { path = "zingodelegator_utils" }

zcash_encoding = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "std",
] }
zcash_address = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "std",
] }
zcash_client_backend = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_keys = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
    "std",
] }
zcash_primitives = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "std",
] }
zcash_proofs = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead" }
zcash_protocol = { git = "https://github.com/ShieldedLabs/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "std",
    "local-consensus",
] }
zcash_transparent = { git = "https://github.com/dorianvp/crosslink_monolith.git", rev = "f398266b32ca1bd87c42e33ade6b6daaf2d8bead", features = [
    "std",
] }

zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", branch = "dev" }

bip0039 = { version = "0.12", features = ["rand"] }
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[profile.release]
debug = 1
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
