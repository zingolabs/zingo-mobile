appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run flows in
# file order, and a flow that inherited the state of the previous one
# would pass or fail on luck. A fresh install lands on the start menu on
# mainnet, and each flow creates or restores its own wallet there.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
    timeout: 120000
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible:
      id: "newseed.button.ok"
    timeout: 120000
- tapOn:
    id: "newseed.button.ok"
- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000

- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
# The Settings sheet is still moving when settings.scroll-view first
# shows. A tap resolved during that animation lands where the row no
# longer is (see 02_options_menu.yaml).
- waitForAnimationToEnd:
    timeout: 5000

# The server choices live in a sheet that the server row opens.
- scrollUntilVisible:
    element:
      id: "settings.server"
- tapOn:
    id: "settings.server"
- extendedWaitUntil:
    visible:
      id: "settings.custom-server"
    timeout: 10000
- tapOn:
    id: "settings.custom-server"

# The chain toggle shows once Custom is chosen. A mainnet wallet already
# has mainnet selected, and the tap keeps it.
- scrollUntilVisible:
    element:
      id: "settings.custom-server-chain.mainnet"
- tapOn:
    id: "settings.custom-server-chain.mainnet"

- scrollUntilVisible:
    element:
      id: "settings.custom-server-field"
    direction: UP
- tapOn:
    id: "settings.custom-server-field"
- eraseText: 100
- inputText: "https://lwd2.zcash-infra.com:9067"

# The server sheet covers the Save button. Closing the sheet unmounts the
# field and takes the keyboard with it.
- tapOn:
    id: "settings.server.close"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings.button.save"

# Save reaches the server, reloads the wallet against it, and returns to
# History. A same-chain change shows no confirmation screen. The check
# icon renders only on History, and only once the wallet is synced.
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000
