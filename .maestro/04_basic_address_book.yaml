appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run them in
# file order — a nightly ran 04, 01, 02, 03 — so a flow that inherited
# whatever the previous one left behind would pass or fail on luck.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "receive.title"
    timeout: 120000

# Open drawer and navigate to Address Book
- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "menu.addressbook"
- extendedWaitUntil:
    visible:
      id: "addressbook.scroll-view"
    timeout: 10000

# Verify the add-new-contact button is present
- assertVisible:
    id: "addressbook.button.new"

- back
