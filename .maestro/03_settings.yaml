appId: org.ZingoLabs.Zingo
---
- launchApp

- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000

# Navigate to Settings: it lives in the Options panel now
- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000

# Scroll to bottom to verify the full Settings screen loaded
- scrollUntilVisible:
    element:
      id: "settings.button.save"
- assertVisible:
    id: "settings.button.save"

- back
