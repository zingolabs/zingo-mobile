appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run them in
# file order — a nightly ran 04, 01, 02, 03 — so a flow that inherited
# whatever the previous one left behind would pass or fail on luck.
# A fresh install lands on the start menu, so each flow creates its own
# wallet before it has an app to drive.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
    timeout: 120000
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible:
      id: "newseed.button.ok"
    timeout: 120000
- tapOn:
    id: "newseed.button.ok"
- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000

# Navigate to Settings: it lives in the Options panel now
- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000

# Scroll to bottom to verify the full Settings screen loaded
- scrollUntilVisible:
    element:
      id: "settings.button.save"
- assertVisible:
    id: "settings.button.save"

- back
