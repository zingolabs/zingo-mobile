appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run them in
# file order — a nightly ran 04, 01, 02, 03 — so a flow that inherited
# whatever the previous one left behind would pass or fail on luck.
# A fresh install lands on the start menu, so each flow creates its own
# wallet before it has an app to drive.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
    timeout: 120000
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible:
      id: "newseed.button.ok"
    timeout: 120000
- tapOn:
    id: "newseed.button.ok"
- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000

# Open the options panel and verify its items are present
- tapOn:
    id: "header.drawmenu"
- assertVisible:
    id: "menu.addressbook"
- assertVisible:
    id: "menu.walletseedufvk"

# Server info now lives inline inside Settings (see settings.*-server rows);
# About remains as its own navigation row. Settings opens from the Options
# panel, which is already open: no closing and reopening in between.
#
# It used to close the panel with `back` and tap the toggle again. On
# Android `back` is the hardware button and closes the panel; on iOS it is
# an edge-swipe, which does nothing to an overlay that is not a navigation
# screen, so the panel stayed open, the second toggle tap closed it, and
# header.settings was gone.
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
- assertVisible:
    id: "settings.about"

# Navigate to About and verify it loads.
#
# The Settings sheet animates in, and `extendedWaitUntil` above is
# satisfied the moment settings.scroll-view becomes visible — which is
# part way through that animation. Maestro then resolves this row's
# coordinates while it is still moving, and the tap lands where the row no
# longer is: on the 2026-09-25 nightly it was dispatched, nothing
# navigated, and the screenshot still showed Settings.
#
# Waiting for the animation was tested against the alternative. Centring
# the row first also made iOS pass, but it changed two things at once —
# position and settling — and it broke Android, whose Settings list has
# too little travel to centre anything. Waiting alone took both platforms
# green, so the timing was what mattered and the row was always reachable.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings.about"
- extendedWaitUntil:
    visible:
      id: "about.scroll-view"
    timeout: 10000

- back
- back
