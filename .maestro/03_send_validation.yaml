appId: org.ZingoLabs.Zingo
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "My Receiving Address"
    timeout: 60000

# Navigate to Send via bottom tab bar
- tapOn:
    text: "SEND"
- extendedWaitUntil:
    visible:
      id: "send.addressplaceholder"
    timeout: 10000

# Enter invalid address and assert error shown
- tapOn:
    id: "send.addressplaceholder"
- inputText: "invalid_address_123"
- extendedWaitUntil:
    visible:
      id: "send.address.error"
    timeout: 5000
