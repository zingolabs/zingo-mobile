appId: org.ZingoLabs.Zingo
---
- launchApp:
    clearState: true

# Create wallet first to reach main app
- assertVisible:
    id: "loadingapp.createnewwallet"
    timeout: 30000
- tapOn:
    id: "loadingapp.createnewwallet"
- assertVisible:
    id: "header"
    timeout: 60000

# Open drawer menu and go to Send
- tapOn:
    id: "header.drawmenu"
- tapOn:
    text: "Send"

# Assert Send screen loaded
- assertVisible:
    id: "send.addressplaceholder"
    timeout: 10000

# Enter invalid address and assert error shown
- tapOn:
    id: "send.addressplaceholder"
- inputText: "invalid_address_123"
- tapOn:
    text: "Send"
- assertVisible:
    id: "send.address.error"
    timeout: 5000
