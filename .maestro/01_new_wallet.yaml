appId: org.ZingoLabs.Zingo
---
- launchApp:
    clearState: true

# A fresh install lands on the start menu: the wallet is created from there,
# and the seed is shown once before the app opens it.
- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
    timeout: 120000
- tapOn:
    id: "loadingapp.createnewwallet"

- extendedWaitUntil:
    visible:
      id: "newseed.button.ok"
    timeout: 120000
- tapOn:
    id: "newseed.button.ok"

- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000
