appId: org.ZingoLabs.Zingo
---
- runFlow:
    file: common/create_wallet.yaml

# A new wallet has its birthday at the chain tip. The check icon shows
# while no sync is in progress.
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000

# Adding a wallet keeps the first one: the switcher opens Wallets, Add
# wallet makes a new seed, and Later opens the new wallet on Home.
- tapOn:
    id: "header.wallets"
- tapOn:
    id: "wallets.add"
- tapOn:
    id: "addwallet.create"
- tapOn:
    id: "newwallet.go"
- extendedWaitUntil:
    visible:
      id: "addwallet.later"
    timeout: 120000
- tapOn:
    id: "addwallet.later"
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000

# Both wallets are listed, the new one open.
- tapOn:
    id: "header.wallets"
- extendedWaitUntil:
    visible:
      id: "wallets.list"
    timeout: 10000
- assertVisible:
    text: "Wallet 1"
- assertVisible:
    text: "Wallet 2"
