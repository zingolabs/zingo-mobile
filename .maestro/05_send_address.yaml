appId: org.ZingoLabs.Zingo
---
- runFlow:
    file: common/create_wallet.yaml

# The Send tab shows for every remote server, with a zero balance and
# before the mixnet is ready. The mixnet gates only the send button, and
# this flow ends before it.
- tapOn:
    id: "tab.send"
- extendedWaitUntil:
    visible:
      id: "send.addressplaceholder"
    timeout: 10000

# The parser rejects a string that is no Zcash address.
- tapOn:
    id: "send.addressplaceholder"
- inputText: "thisisaninvalidaddress"
- extendedWaitUntil:
    visible:
      id: "send.address.error"
    timeout: 10000

# The ZIP 320 example from the zcash_address 0.13.0 test vectors, a
# mainnet TEX address.
- runFlow:
    file: common/clear_send_address.yaml
- inputText: "tex1s2rt77ggv6q989lr49rkgzmh5slsksa9khdgte"
- extendedWaitUntil:
    visible:
      id: "send.address.check"
    timeout: 10000

# The zingolib Zennies-for-Zingo donation address, a mainnet unified
# address with Orchard and Sapling receivers. A shielded receiver opens
# the memo field.
- runFlow:
    file: common/clear_send_address.yaml
- inputText: "u1p32nu0pgev5cr0u6t4ja9lcn29kaw37xch8nyglwvp7grl07f72c46hxvw0u3q58ks43ntg324fmulc2xqf4xl3pv42s232m25vaukp05s6av9z76s3evsstax4u6f5g7tql5yqwuks9t4ef6vdayfmrsymenqtshgxzj59hdydzygesqa7pdpw463hu7afqf4an29m69kfasdwr494"
- extendedWaitUntil:
    visible:
      id: "send.address.check"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "send.memo-field"
- assertVisible:
    id: "send.memo-field"
