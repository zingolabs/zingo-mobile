appId: org.ZingoLabs.Zingo
---
- runFlow:
    file: common/create_wallet.yaml

# The Server screen is the last item of the options panel.
- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "menu.server"
- extendedWaitUntil:
    visible:
      id: "server.card"
    timeout: 10000
# The screen is still moving when the card first shows. A tap resolved
# during that animation lands where the row no longer is (see
# 02_options_menu.yaml).
- waitForAnimationToEnd:
    timeout: 5000

# Third-party servers live one level down, under Other servers. The list
# comes from a live registry, or from the built-in servers when the fetch
# fails, so its rows and their order vary from night to night. The flow
# picks the row by its server, and scrolls to it, because it can sit below
# the fold. A pick there switches to the server right away.
- tapOn:
    id: "server.other"
- extendedWaitUntil:
    visible:
      id: "serverlist.back"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "serverlist.pick.zec.rocks:443"
    timeout: 30000
- tapOn:
    id: "serverlist.pick.zec.rocks:443"
- waitForAnimationToEnd:
    timeout: 5000

# Back on the Server screen, the card names the server once the wallet
# reconnected. The match is whole, so an automatic choice of the same
# server, which reads "zec.rocks (automatic)", does not pass for it. On
# Android the name and the status are two texts inside the card. On iOS
# the card is one element whose text joins them.
- tapOn:
    id: "serverlist.back"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "zec\\.rocks"
            childOf:
              id: "server.card"
          timeout: 120000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "server.card"
            text: "zec\\.rocks, .*"
          timeout: 120000

# History shows the check icon once no sync is in progress on the server.
- tapOn:
    id: "server.back"
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000
