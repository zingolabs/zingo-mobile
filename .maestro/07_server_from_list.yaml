appId: org.ZingoLabs.Zingo
---
- runFlow:
    file: common/create_wallet.yaml

- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
# The Settings sheet is still moving when settings.scroll-view first
# shows. A tap resolved during that animation lands where the row no
# longer is (see 02_options_menu.yaml).
- waitForAnimationToEnd:
    timeout: 5000

# The server choices live in a sheet that the server row opens.
- scrollUntilVisible:
    element:
      id: "settings.server"
- tapOn:
    id: "settings.server"
- extendedWaitUntil:
    visible:
      id: "settings.list-server"
    timeout: 10000
- tapOn:
    id: "settings.list-server"

# Settings fetches the mainnet list from a live registry when it opens,
# and falls back to the built-in servers when the fetch fails. The list
# holds only the servers that the registry reports online, and the rows
# and their order vary from night to night. The flow picks the row by its
# server name, and scrolls to it, because the row can sit below the fold.
# The first row could be the server already in use, and a save then
# reconnects nothing. The Settings screen under the sheet can show the
# same name, so the selector takes the row inside the list.
- extendedWaitUntil:
    visible:
      id: "settings.list-server-select"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "https://zec\\.rocks:443"
      childOf:
        id: "settings.list-server-select"
- tapOn:
    text: "https://zec\\.rocks:443"
    childOf:
      id: "settings.list-server-select"
- waitForAnimationToEnd:
    timeout: 5000

# The server sheet covers the Save button.
- tapOn:
    id: "settings.server.close"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings.button.save"

# Settings returns to History, where the check icon renders once the
# wallet has synced on the saved server.
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000

# The server row shows the saved server after the wallet reconnected.
- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings.server"
- assertVisible:
    text: "https://zec\\.rocks:443/?"
