appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run flows in
# file order, and a flow that inherited the state of the previous one
# would pass or fail on luck. A fresh install lands on the start menu on
# mainnet, and each flow creates or restores its own wallet there.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "loadingapp.createnewwallet"
    timeout: 120000
- tapOn:
    id: "loadingapp.createnewwallet"
- extendedWaitUntil:
    visible:
      id: "newseed.button.ok"
    timeout: 120000
- tapOn:
    id: "newseed.button.ok"
- extendedWaitUntil:
    visible:
      id: "header.drawmenu"
    timeout: 120000

- tapOn:
    id: "header.drawmenu"
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
# The Settings sheet is still moving when settings.scroll-view first
# shows. A tap resolved during that animation lands where the row no
# longer is (see 02_options_menu.yaml).
- waitForAnimationToEnd:
    timeout: 5000

# The server choices live in a sheet that the server row opens.
- scrollUntilVisible:
    element:
      id: "settings.server"
- tapOn:
    id: "settings.server"
- extendedWaitUntil:
    visible:
      id: "settings.list-server"
    timeout: 10000
- tapOn:
    id: "settings.list-server"

# Settings fetches the mainnet list from a live registry when it opens,
# and falls back to the built-in servers when the fetch fails. The rows
# and their order vary from night to night, and the flow takes the first
# row whatever it names.
- extendedWaitUntil:
    visible:
      id: "settings.list-server-select.0"
    timeout: 30000
- tapOn:
    id: "settings.list-server-select.0"
- waitForAnimationToEnd:
    timeout: 5000

# The server sheet covers the Save button.
- tapOn:
    id: "settings.server.close"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings.button.save"

# The first row can be the server already in use. Save then records the
# List choice without a reconnect. Either way Settings returns to History,
# where the check icon renders once the wallet is synced.
- extendedWaitUntil:
    visible:
      id: "header.checkicon"
    timeout: 300000
