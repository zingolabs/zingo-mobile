appId: org.ZingoLabs.Zingo
---
# Every flow starts from a clean install. Maestro does not run them in
# file order — a nightly ran 04, 01, 02, 03 — so a flow that inherited
# whatever the previous one left behind would pass or fail on luck.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "receive.title"
    timeout: 120000

# Open options panel and verify basic-mode items are present
- tapOn:
    id: "header.drawmenu"
- assertVisible:
    id: "menu.addressbook"
- assertVisible:
    id: "menu.loadwalletfromseed"

# Server info now lives inline inside Settings (see settings.*-server rows);
# About remains as its own navigation row. Settings opens from the Options
# panel, which is already open: no closing and reopening in between.
#
# It used to close the panel with `back` and tap the toggle again. On
# Android `back` is the hardware button and closes the panel; on iOS it is
# an edge-swipe, which does nothing to an overlay that is not a navigation
# screen, so the panel stayed open, the second toggle tap closed it, and
# header.settings was gone.
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000
- assertVisible:
    id: "settings.about"

# Navigate to About and verify it loads
- tapOn:
    id: "settings.about"
- extendedWaitUntil:
    visible:
      id: "about.scroll-view"
    timeout: 10000

- back
- back
