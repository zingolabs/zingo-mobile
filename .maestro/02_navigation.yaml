appId: org.ZingoLabs.Zingo
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "My Receiving Address"
    timeout: 60000

# Navigate to Send via bottom tab bar
- tapOn:
    text: "SEND"
- extendedWaitUntil:
    visible:
      id: "send.addressplaceholder"
    timeout: 10000

# Go back to Receive
- back
- extendedWaitUntil:
    visible:
      text: "My Receiving Address"
    timeout: 10000

# Navigate to Settings via gear icon in header
- tapOn:
    id: "header.settings"
- extendedWaitUntil:
    visible:
      id: "settings.scroll-view"
    timeout: 10000

- back
